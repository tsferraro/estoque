<head>

<style>
  :root{--orange:#FF6E00;--orange-dark:#B24D00;--orange-bg:#FFF5EE;--navy:#0E2A47;--bg:#F7F8FA;--text:#1A1A1A;--text2:#5A6472;--line:#E3E6EB;--ok:#1E7A46;--ok-bg:#EAF6EF;--erro:#B3261E;--erro-bg:#FCEDEC}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:Ubuntu,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px 16px 40px;font-size:16px}
  .cartao{max-width:460px;margin:0 auto;background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 2px 24px rgba(14,42,71,.10)}
  header{display:flex;align-items:center;gap:12px;margin:0 0 16px}
  header .u{width:40px;height:40px;border-radius:10px;background:var(--orange);color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center}
  h1{margin:0;font-size:19px;line-height:1.2} header small{display:block;color:var(--text2);font-size:13px}
  h2{margin:0 0 12px;font-size:18px}
  .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:18px 0 8px}
  label.chave{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}
  label.chave input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--orange);flex:none}
  label.chave b{display:block} label.chave span{font-size:13px;color:var(--text2)}
  .orgs{display:flex;flex-direction:column;gap:10px}
  a.org{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text);border:1.5px solid var(--line);border-radius:12px;padding:14px}
  a.org .n{font-weight:700;display:block} a.org .d{font-size:13px;color:var(--text2);display:block}
  a.org .seta{margin-left:auto;color:var(--orange);font-weight:700;font-size:20px}
  .faixa{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .pill{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--bg);color:var(--text2)}
  .pill.on{background:var(--ok-bg);color:var(--ok)} .pill.off{background:var(--erro-bg);color:var(--erro)} .pill.laranja{background:var(--orange-bg);color:var(--orange-dark)}
  button{font:inherit;cursor:pointer}
  .grande{display:block;width:100%;border:0;border-radius:12px;padding:16px;font-weight:700;font-size:17px;background:var(--orange);color:#fff}
  .grande:disabled{background:#C9CED6}
  .grande.sec{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
  .acoes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .acao{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:16px 6px;font-weight:700;color:var(--navy)}
  .acao.prim{border-color:var(--orange);background:var(--orange-bg);color:var(--orange-dark)}
  .acao:disabled{color:#A7AEB8;background:var(--bg)} .acao small{display:block;font-weight:400;font-size:11px;margin-top:2px}
  ul.fila{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
  ul.fila li{border:1.5px solid var(--line);border-radius:12px;padding:12px;font-size:14px;line-height:1.4}
  ul.fila li b{display:block;font-size:15px}
  ul.fila li.guardado{border-color:var(--orange)} ul.fila li.enviado{border-color:var(--ok)} ul.fila li.recusado{border-color:var(--erro)}
  .st{font-size:13px;font-weight:700;margin-top:4px}
  li.guardado .st{color:var(--orange-dark)} li.enviado .st{color:var(--ok)} li.recusado .st{color:var(--erro)}
  .link{background:none;border:0;color:var(--navy);text-decoration:underline;padding:4px 0;font-size:13px}
  .grade{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opc{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:14px 10px;font-weight:700;text-align:left}
  .opc.on{border-color:var(--orange);background:var(--orange-bg)}
  .txt{width:100%;font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:12px;color:var(--text)}
  .txt:focus{outline:none;border-color:var(--orange)}
  .sug{display:flex;flex-direction:column;gap:6px;margin:8px 0 0}
  .sug button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;text-align:left}
  .sug button.nova{border-style:dashed;color:var(--orange-dark)}
  .linha{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-left:4px solid var(--orange);border-radius:10px;padding:8px 10px;margin:8px 0 0}
  .linha .nome{flex:1;font-weight:700;font-size:15px} .linha .nome small{display:block;font-weight:400;color:var(--text2);font-size:12px}
  .linha input{width:96px;font:inherit;font-weight:700;text-align:right;border:1.5px solid var(--line);border-radius:8px;padding:10px 8px}
  .linha .x{border:0;background:none;color:var(--text2);font-size:20px;padding:4px 6px}
  .total{margin:12px 0;font-size:15px} .total b{font-size:18px}
  .topo{display:flex;align-items:center;gap:8px;margin:0 0 12px} .topo .link{font-size:15px}
  .aviso{font-size:13px;color:var(--text2);line-height:1.5;margin:10px 0 0}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.2);display:none;z-index:9}
  select.txt{background:#fff}
  ul.fila li.alerta{border-color:var(--orange);background:var(--orange-bg)} li.alerta .st{color:var(--orange-dark)}
  ul.fila li.espera{border-color:var(--text2)} li.espera .st{color:var(--text2)}
  .card{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-left:4px solid var(--orange);border-radius:12px;padding:12px;margin:8px 0 0;background:#fff;width:100%;text-align:left}
  .card .m{flex:1} .card .m b{display:block;font-size:15px} .card .m small{display:block;color:var(--text2);font-size:12px;margin-top:2px}
  .card .kg{font-weight:700;font-size:16px;white-space:nowrap} .card .mais{border:1.5px solid var(--orange);color:var(--orange-dark);border-radius:8px;padding:6px 12px;font-weight:700;font-size:18px;background:#fff}
  .local{color:var(--orange-dark)!important;font-weight:700}
  .erro-linha{font-size:12px;color:var(--erro);margin:4px 0 0}
  .nota-linha{font-size:12px;color:var(--text2);margin:4px 0 0}
  .acabou{display:flex;align-items:center;gap:6px;font-size:13px;margin:6px 0 0} .acabou input{width:20px;height:20px;accent-color:var(--orange)}
  .aviso-saida{font-size:13px;background:var(--orange-bg);border:1.5px solid var(--orange);border-radius:10px;padding:10px;margin:10px 0 0;line-height:1.4}
  .lista-fam{max-height:min(44vh,320px);overflow-y:auto;-webkit-overflow-scrolling:touch;border:1.5px solid var(--line);border-radius:12px;margin:8px 0 0}
  label.fam{display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;line-height:1.3;overflow-wrap:anywhere}
  label.fam:last-child{border-bottom:0} label.fam:active{background:var(--orange-bg)}
  label.fam input{width:22px;height:22px;accent-color:var(--orange);flex:none;margin:0}
  .vazio-fam{padding:14px 12px;font-size:14px;color:var(--text2)}
  .tudo{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--navy)}
</style>
</head>
<body>
<main class="cartao" id="app"></main>
<div class="toast" id="toast" role="status"></div>
<script>
/* ── PROTÓTIPO · lançadora com versão offline (30/09/2026) ─────────────────
 * Handoff `camtaua/working/HANDOFF-2026-09-30_offline-e-lancadora.md` · H10-59.
 * Fonte: camtaua/copias/lancadora/offline-teste/ no repositório sistema.
 *
 * A invariante do padrão da casa (webapp-mandu, referência 08 «fila
 * offline-first»): NADA TOCA A REDE ANTES DE ESTAR GUARDADO NO APARELHO, e a
 * tela confirma a GRAVAÇÃO, nunca o envio. «Guardado no aparelho» ≠ «na
 * planilha» — só o retorno do servidor muda para «na planilha · REC-…».
 *
 * O ENVIO É UMA NAVEGAÇÃO, NÃO UM fetch. O app roda como quem acessa
 * (USER_ACCESSING): só uma navegação de topo leva o login Google. A fila vai
 * no fragmento (#f=…) para `/exec?modo=sincronizar`; a página de lá grava pelo
 * google.script.run e devolve os resultados no fragmento desta (#r=…).
 * Reenviar é seguro: o servidor deduplica pelo token do gesto (R-411). */

var ORGS = [
  { id:'camtaua', nome:'Camtauá', desc:'Santo Antônio do Tauá, PA',
    url:'https://script.google.com/a/macros/mandusocial.org/s/AKfycbyw9syhEIyuaMaYT-ej95koauzv4hXlLJEyAXY6OMwL4Ba6socaChpIapRx9ekWcVve/exec',
    offline:'' },   // produção: offline ainda não liberado
  { id:'demo', nome:'Camtauá · Demonstração', desc:'Base limpa para teste e apresentação',
    url:'https://script.google.com/a/macros/mandusocial.org/s/AKfycbyVou5SnmL8RYNWqWWDIb0sY-WsiTW7zvCTnCd9mDnXg7vNj_onBWOKphDJlGR0TC2J/exec',
    offline:'https://script.google.com/a/macros/mandusocial.org/s/AKfycbwzgQpOQ4W_KHeUwUyzPamxQ-Tl7Ey7rDUgL83FY3lOfJPNXMfrltdoO1cHsrMt5JQ6/exec' }
];

/* ── armazenamento: uma chave versionada, lida e gravada inteira (sem await
   no meio, então não há retrato velho para gravar por cima — referência 08 §6.2) */
var CHAVE = 'estoque_offline_v1';
function ler(){ try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch(e){ return {}; } }
function gravar(db){
  try { localStorage.setItem(CHAVE, JSON.stringify(db)); return localStorage.getItem(CHAVE) === JSON.stringify(db); }
  catch(e){ return false; }          // cota estourada ou modo privado: a tela PRECISA dizer
}
function mudar(fn){ var db = ler(); db.fila = db.fila || []; db.cadastros = db.cadastros || {}; db.operador = db.operador || {}; fn(db); return gravar(db); }
function novoToken(){ return (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)); }

function b64url(t){ return btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function deB64url(s){ s = String(s).replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function kgTxt(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2}); }
/* ADR-031: separador seguido de EXATAMENTE 3 dígitos é milhar; outra contagem é decimal. */
function numDe(v){
  var s = String(v == null ? '' : v).trim().replace(/\s/g,''); if (!s) return 0;
  var sep = s.match(/[.,]/g) || [];
  if (sep.length > 1) { var ult = Math.max(s.lastIndexOf(','), s.lastIndexOf('.')); s = s.slice(0,ult).replace(/[.,]/g,'') + '.' + s.slice(ult+1); }
  else if (sep.length === 1) { var p = s.split(/[.,]/); s = p[1].length === 3 ? p[0] + p[1] : p[0] + '.' + p[1]; }
  var n = Number(s); return isFinite(n) ? n : 0;
}
/* OFF2 · a hora que a tela mostra é a da ORGANIZAÇÃO (`cadastros.fuso`), não a do celular:
   o iPhone na França mostrava 14:24 para um gesto que na planilha é 09:24. */
var FUSO_PADRAO = 'America/Sao_Paulo';
function quandoTxt(iso, fuso){
  var o = {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'};
  try { o.timeZone = fuso || FUSO_PADRAO; return new Date(iso).toLocaleString('pt-BR', o); }
  catch(e){ delete o.timeZone; return new Date(iso).toLocaleString('pt-BR', o); }
}
function toast(msg){ var t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display = 'none'; }, 4200); }

var TELA = { nome:'inicio', form:null };
var ultima = null; try { ultima = localStorage.getItem('estoque_org'); } catch(e){}

function orgsOffline(){ return ORGS.filter(function(o){ return o.offline; }); }
function orgAtual(){
  var db = ler(), lista = orgsOffline();
  return lista.find(function(o){ return o.id === db.orgOffline; }) || lista.find(function(o){ return o.id === ultima; }) || lista[0];
}

/* ── RETORNO do /exec?modo=sincronizar (#r=…) ─────────────────────────────── */
function lerRetorno(){
  var h = location.hash; if (h.indexOf('#r=') !== 0) return;
  history.replaceState(null, '', location.pathname + location.search);
  var r; try { r = JSON.parse(deB64url(h.slice(3))); } catch(e){ toast('O retorno do envio veio ilegível — nada foi marcado; envie de novo.'); return; }
  var ok = 0, rec = 0, espera = 0;
  var gravou = mudar(function(db){
    (r.resultados || []).forEach(function(res){
      var it = db.fila.find(function(i){ return i.token === res.token; }); if (!it) return;
      it.mensagem = res.mensagem || '';
      if (res.pendente) { it.estado = 'guardado'; it.aviso = res.mensagem || ''; espera++; }                 /* fica na fila: NÃO é recusa */
      else if (res.ok) { it.estado = 'enviado'; it.codigos = res.codigos || []; it.codigo = res.codigo || (res.codigos||[])[0] || ''; it.filhos = res.filhos || [];
                         it.repetido = !!res.repetido; it.alerta = !!res.jaFechada; it.enviadoEm = r.quando; it.erro = ''; it.aviso = ''; ok++; }
      else { it.estado = 'recusado'; it.erro = res.erro || 'recusado'; it.aviso = ''; rec++; }
    });
    trocarRefs(db);
    db.cadVelho = db.cadVelho || {};
    if (r.cadastros) { db.cadastros[r.org] = r.cadastros; db.cadVelho[r.org] = false; }
    else if (ok) db.cadVelho[r.org] = true;                   /* OFF3 · entrou item e os cadastros não vieram: o retrato do aparelho ficou velho */
    db.orgOffline = r.org;
    /* poda: só o JÁ ENVIADO sai, e só depois de 30 dias. Pendente nunca sai sozinho. */
    db.fila = db.fila.filter(function(i){ return i.estado !== 'enviado' || Date.now() - Date.parse(i.enviadoEm || i.quando) < 30 * 864e5; });
  });
  toast(!gravou ? 'O aparelho recusou guardar o retorno — confira o espaço livre.' :
        (r.resultados||[]).length ? (ok + ' na planilha' + (rec ? ' · ' + rec + ' recusado(s)' : '') + (espera ? ' · ' + espera + ' esperando a origem' : '') + (r.cadastros ? ' · cadastros atualizados' : ' · cadastros NÃO atualizados — toque em «Atualizar cadastros»')) :
        'Modo offline preparado · cadastros guardados no aparelho');
}

/* ── OFF2 · REF: o item que aponta para outro (`ref` = token do item de origem) ──────────────
   Depois que a origem ENTRA na planilha ela ganha código real, e o dependente que ainda não foi
   enviado passa a apontar para o código (a lançadora guarda o código que voltou). */
function temFilho(l){ return l.filho !== undefined && l.filho !== null && l.filho !== ''; }
function codDoFilho(filhos, filho){ var f = (filhos || []).find(function(x){ return String(x.filho) === String(filho); }); return f ? f.codigo : ''; }
function trocarRefs(db){
  var cod = {}, fil = {};
  db.fila.forEach(function(i){ if (i.estado === 'enviado') { var c = i.codigo || (i.codigos || [])[0]; if (c) { cod[i.token] = c; fil[i.token] = i.filhos || []; } } });
  db.fila.forEach(function(i){
    if (i.estado === 'enviado') return;
    var p = i.payload || {};
    /* OFF3 · `{ref, filho}` aponta para o lote que um FECHAR gerou: troca pelo código do filho que voltou */
    if (i.tipo === 'abrir') (p.lotes || []).forEach(function(l){
      if (!l.ref || !cod[l.ref]) return;
      var c = temFilho(l) ? codDoFilho(fil[l.ref], l.filho) : cod[l.ref];
      if (c) { l.codigo = c; delete l.ref; delete l.filho; } });
    if (i.tipo === 'fechar' && p.ref && cod[p.ref]) { p.codigo = cod[p.ref]; delete p.ref; }
  });
}
function refsDe(i){
  var p = i.payload || {}, r = [];
  if (i.tipo === 'abrir') (p.lotes || []).forEach(function(l){ if (l.ref) r.push(l.ref); });
  if (i.tipo === 'fechar' && p.ref) r.push(p.ref);
  return r;
}
/* quem depende (direta ou indiretamente) do item `token` e ainda não foi enviado */
function dependentesDe(fila, token){
  var out = [], vistos = {}; vistos[token] = true;
  var mudou = true;
  while (mudou) { mudou = false;
    fila.forEach(function(i){ if (vistos[i.token] || i.estado === 'enviado') return;
      if (refsDe(i).some(function(r){ return vistos[r]; })) { vistos[i.token] = true; out.push(i); mudou = true; } }); }
  return out;
}

/* ── ENVIO: navegação para o /exec da organização ─────────────────────────── */
function enviar(soCadastros){
  var org = orgAtual(), db = ler();
  var pend = soCadastros ? [] : (db.fila || []).filter(function(i){ return i.org === org.id && i.estado === 'guardado'; });
  if (!navigator.onLine) { toast('Sem rede agora. Está tudo guardado no aparelho — envie quando o sinal voltar.'); return; }
  var pacote = { volta: location.origin + location.pathname, org: org.id, fuso: (db.cadastros && db.cadastros[org.id] && db.cadastros[org.id].fuso) || FUSO_PADRAO,
                 fila: pend.map(function(i){ return { token:i.token, tipo:i.tipo, quando:i.quando, payload:i.payload }; }) };
  location.href = org.offline + '?modo=sincronizar#f=' + b64url(JSON.stringify(pacote));
}

/* ── TELAS ────────────────────────────────────────────────────────────────── */
function render(){
  var db = ler(), app = document.getElementById('app');
  if (TELA.nome === 'receber') { app.innerHTML = telaReceber(db); ligarReceber(); return; }
  if (TELA.nome === 'abrir')   { app.innerHTML = telaAbrir(db);   ligarAbrir();   return; }
  if (TELA.nome === 'fechar')  { app.innerHTML = telaFechar(db);  ligarFechar();  return; }
  var h = '<header><div class="u">Ū</div><div><h1>Gestão de Estoque</h1><small>Mandū Inovação Social</small></div></header>';
  h += '<label class="chave"><input type="checkbox" id="chk-off"' + (db.modoOffline ? ' checked' : '') + '>' +
       '<div><b>Versão offline</b><span>Receber, abrir e fechar. O que você lança fica guardado neste aparelho e vai para a planilha quando houver rede.</span></div></label>';
  if (!db.modoOffline) {
    h += '<p class="lbl">Escolha a organização</p><nav class="orgs">' + ORGS.map(function(o){
      return '<a class="org" href="' + esc(o.url) + '" data-org="' + esc(o.id) + '"><span><span class="n">' + esc(o.nome) + '</span><span class="d">' + esc(o.desc) + '</span></span><span class="seta">›</span></a>';
    }).join('') + '</nav>';
    app.innerHTML = h; ligarInicio(); return;
  }
  var org = orgAtual(), cad = db.cadastros && db.cadastros[org.id];
  var fila = (db.fila || []).filter(function(i){ return i.org === org.id; });
  var pend = fila.filter(function(i){ return i.estado === 'guardado'; });
  var lista = orgsOffline();
  h += '<p class="lbl">Organização</p>' + (lista.length > 1 ?
       '<select class="txt" id="sel-org">' + lista.map(function(o){ return '<option value="' + esc(o.id) + '"' + (o.id === org.id ? ' selected' : '') + '>' + esc(o.nome) + '</option>'; }).join('') + '</select>' :
       '<div><b>' + esc(org.nome) + '</b></div>');
  h += '<div class="faixa" style="margin-top:12px">' +
       '<span class="pill ' + (navigator.onLine ? 'on' : 'off') + '" id="pill-rede">' + (navigator.onLine ? 'com rede' : 'sem rede') + '</span>' +
       '<span class="pill">' + (cad ? 'cadastros de ' + quandoTxt(cad.geradoEm, fusoDe(cad)) : 'cadastros: ainda não') + '</span>' +
       (pend.length ? '<span class="pill laranja">' + pend.length + ' guardado(s) no aparelho</span>' : '') +
       ((db.cadVelho || {})[org.id] ? '<span class="pill off" id="pill-velho">cadastros desatualizados · toque em «Atualizar cadastros»</span>' : '') + '</div>';
  if (!cad) {
    h += '<p class="aviso" style="margin:0 0 12px">Para lançar sem rede, o aparelho precisa guardar uma vez as comunidades, famílias e produtos desta organização. Faça isso agora, com sinal.</p>' +
         '<button class="grande" id="btn-preparar">Preparar o modo offline</button>';
    app.innerHTML = h; ligarInicio(); return;
  }
  h += '<div class="acoes"><button class="acao prim" id="btn-receber">Receber</button>' +
       '<button class="acao prim" id="btn-abrir">Abrir</button>' +

                   : '<p class="aviso" style="margin:0 0 12px">Nada lançado neste aparelho ainda.</p>';
  h += '<button class="grande' + (pend.length ? '' : ' sec') + '" id="btn-enviar">' +
       (pend.length ? 'Enviar ' + pend.length + ' para a planilha' : 'Atualizar cadastros') + '</button>';
  h += '<p class="aviso">Quem assina o envio é a conta Google aberta no celular na hora de enviar. Enviar de novo é seguro: o que já entrou não entra duas vezes.</p>';

/* ══ OFF2 · ESTOQUE PROJETADO NO APARELHO ══════════════════════════════════════════════════
   lotes dos cadastros − kg usados por Abrir ainda NÃO enviados + lotes de Receber ainda não
   enviados («guardado no aparelho · ainda sem código»).
   Abertas = cadastros + Abrir não enviados − Fechar não enviados.
   As regras abaixo COPIAM as do index.html do app (a fonte de cada uma está no comentário):
   a lançadora não inventa a regra — ela a repete, e o portão compara os dois. */
var MES_CURTO = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function codData(cod){ var m = String(cod||'').match(/(\d{8})/); return m ? m[1] : '00000000'; }                 /* app: codData */
function dataCurta(cod){ var d = codData(cod); return d === '00000000' ? '' : Number(d.slice(6,8)) + '/' + (MES_CURTO[Number(d.slice(4,6)) - 1] || ''); }   /* app: dataCurta */
function diasTxt(n){ if (n == null) return 'sem data de entrada'; var d = Math.round(Number(n) || 0); return 'há ' + d + ' dia' + (Math.abs(d) === 1 ? '' : 's'); }   /* app: diasTxt */
function arred2(n){ return Math.round(n * 100) / 100; }
function fusoDe(cad){ return (cad && cad.fuso) || FUSO_PADRAO; }
function etapaDeCad(cad, id){ return (cad.etapas || []).find(function(e){ return e.id === id; }) || null; }
function ehMov(et){ return !!et && et.tipo === 'Movimentação'; }
function ordDe(cad, et){ return (cad.ord && cad.ord[et]) || 9; }                                                  /* app: ordEtapa */
/* app: podeEntrar — material só anda para FRENTE; subproduto só entra no Armazenamento */
function podeEntrar(cad, l, etapa){
  if (!l || !etapa || l.etapa === etapa) return false;
  if (l.sub) return etapa === 'ARM' && ordDe(cad, etapa) > ordDe(cad, l.etapa);
  return ordDe(cad, etapa) > ordDe(cad, l.etapa);
}
function aceitosDe(et){ var a = {}; (et.cad || []).forEach(function(c){ if (c[1]) a[c[1]] = true; }); return a; }
/* app: lotesElegiveis — saldo > 0, o PRODUTO é aceito pela etapa (ADR-012) e a etapa vem depois de onde o lote está */
function lotesElegiveis(cad, proj, etapaId){
  var et = etapaDeCad(cad, etapaId); if (!et) return [];
  var aceitos = aceitosDe(et), temConfig = Object.keys(aceitos).length > 0;
  return proj.lista.map(function(k){ return proj.lotes[k]; }).filter(function(l){
    if (!(l.saldo > 0.001)) return false;
    if (!podeEntrar(cad, l, etapaId)) return false;
    return temConfig ? !!aceitos[l.produto] : true;
  });
}
/* app: cfgDe — casamento exato (cadeia, etapa, produto de entrada), senão a primeira linha da cadeia nessa etapa */
function cfgDe(et, cadeia, produto){
  var frouxo = null, cs = (et && et.cad) || [];
  for (var i = 0; i < cs.length; i++) {
    if (cs[i][0] !== cadeia) continue;
    if (cs[i][1] === produto) return cs[i];
    if (!frouxo) frouxo = cs[i];
  }
  return frouxo;
}
function cadeiaDoProduto(cad, produto){
  var m = (cad.materias || []).find(function(x){ return x[0] === produto; });
  if (m) return m[1] || produto;
  var l = (cad.lotes || []).find(function(x){ return x[1] === produto; });
  return l ? l[2] : produto;
}
/* OFF3 · a chave de um lote na projeção: o código real, ou `ref:<token>` (Receber) / `ref:<token>#<filho>` (o que um Fechar gerou) */
function chaveLote(l){ return l.codigo || ('ref:' + l.ref + (temFilho(l) ? '#' + l.filho : '')); }
/* OFF3 · os lotes que um Fechar ainda não enviado GERA — o principal (saída única, ou o principal da multi-saída) e CADA subproduto
   com peso > 0. `filho` é o que o servidor entende: 'principal' (o código da própria operação) ou o ÍNDICE do subproduto na lista
   `subprodutos` do gesto (a posição, não o slot do cadastro: o app só manda os que têm peso). Cadeia herdada da operação; etapa de
   origem = a da operação; subproduto só entra no Armazenamento (`sub`). */
function filhosDoFechar(cad, it, p, op){
  var cadeia = p.cadeia || (op && op.cadeia) || cadeiaDoProduto(cad, p.produtoEntrada || (op && op.produto)), out = [];
  var novo = function(filho, produto, kg, sub){
    return { chave:'ref:' + it.token + '#' + filho, codigo:'', ref:it.token, filho:filho, produto:produto, cadeia:cadeia, saldo:arred2(kg),
             etapa:p.etapa, sub:sub, dias:null, local:true }; };
  if (p.principal) {
    if ((Number(p.principal.kg) || 0) > 0) out.push(novo('principal', p.principal.produto, Number(p.principal.kg), false));
    (p.subprodutos || []).forEach(function(s, k){ if ((Number(s.kg) || 0) > 0) out.push(novo(k, s.produto, Number(s.kg), true)); });
  } else if ((Number(p.pesoSaida) || 0) > 0) out.push(novo('principal', p.produtoSaida || p.produtoEntrada, Number(p.pesoSaida), false));
  return out;
}
function projecao(db, org){
  var cad = db.cadastros[org.id], P = { lotes:{}, lista:[], abertas:{}, alista:[] };
  (cad.lotes || []).forEach(function(l){
    P.lotes[l[0]] = { chave:l[0], codigo:l[0], ref:'', produto:l[1], cadeia:l[2], saldo:l[3], etapa:l[4], sub:!!l[5], dias:l[6], local:false };
    P.lista.push(l[0]); });
  (cad.abertas || []).forEach(function(a){
    P.abertas[a[0]] = { chave:a[0], codigo:a[0], ref:'', etapa:a[1], produto:a[2], cadeia:a[3], kg:a[4], local:false };
    P.alista.push(a[0]); });
  (db.fila || []).filter(function(i){ return i.org === org.id && i.estado === 'guardado'; }).forEach(function(it){
    var p = it.payload || {};
    if (it.tipo === 'receber') {
      var k = 'ref:' + it.token, tot = (p.itens || []).reduce(function(a, x){ return a + x.kg; }, 0);
      P.lotes[k] = { chave:k, codigo:'', ref:it.token, produto:p.produto, cadeia:cadeiaDoProduto(cad, p.produto), saldo:arred2(tot), etapa:'REC', sub:false, dias:null, local:true };
      P.lista.push(k);
    } else if (it.tipo === 'abrir') {
      var total = 0;
      (p.lotes || []).forEach(function(l){
        var l0 = P.lotes[chaveLote(l)]; total += Number(l.kg) || 0;
        if (l0) l0.saldo = l.esgotou ? 0 : arred2(l0.saldo - l.kg);
      });
      var et = etapaDeCad(cad, p.etapa);
      if (et && !ehMov(et)) {          /* Movimentação abre e fecha no mesmo gesto: não fica aberta */
        var ka = 'ref:' + it.token;
        P.abertas[ka] = { chave:ka, codigo:'', ref:it.token, etapa:p.etapa, produto:p.produto, cadeia:p.cadeia, kg:arred2(total), local:true };
        P.alista.push(ka);
      }
    } else if (it.tipo === 'fechar') {
      var opk = p.codigo || ('ref:' + p.ref), opx = P.abertas[opk];
      delete P.abertas[opk];
      /* OFF3 · o que o Fechar GERA vira lote projetado: a etapa seguinte o oferece sem rede */
      filhosDoFechar(cad, it, p, opx).forEach(function(l){ P.lotes[l.chave] = l; P.lista.push(l.chave); });
    }
  });
  P.alista = P.alista.filter(function(k){ return !!P.abertas[k]; });
  return P;
}
var LOCAL_TXT = 'guardado no aparelho · ainda sem código';
function rotuloLote(l){ return l.codigo ? l.codigo + (l.dias != null ? ' · ' + diasTxt(l.dias) : '') : LOCAL_TXT; }
function nomeDaEtapa(cad, id){ var e = etapaDeCad(cad, id); return e ? e.nome : id; }

/* Uma linha da fila, qualquer tipo. «Abrir Secagem · 9.000 kg · lote REC-…/guardado no aparelho». */
function linhaFila(i, fila, fuso){
  var p = i.payload || {}, cad = (ler().cadastros || {})[i.org] || {}, titulo = '', det = '';
  if (i.tipo === 'receber') {
    var tr = p.itens.reduce(function(a, x){ return a + x.kg; }, 0);
    titulo = 'Receber · ' + p.produto + ' · ' + kgTxt(tr) + ' kg';
    det = p.itens.length + ' família(s) · ' + (p.comunidadeNome || '');
  } else if (i.tipo === 'abrir') {
    var ta = (p.lotes || []).reduce(function(a, x){ return a + (Number(x.kg) || 0); }, 0);
    titulo = 'Abrir ' + (p.etapaNome || p.etapa) + ' · ' + kgTxt(ta) + ' kg';
    det = (p.lotes || []).map(function(l){ return 'lote ' + (l.codigo || 'guardado no aparelho'); }).join(' + ');
  } else if (i.tipo === 'fechar') {
    var tf = p.pesoSaida != null ? Number(p.pesoSaida) || 0 :
      (Number((p.principal || {}).kg) || 0) + (p.subprodutos || []).reduce(function(a, x){ return a + (Number(x.kg) || 0); }, 0);
    titulo = 'Fechar ' + (p.etapaNome || p.etapa) + ' · saiu ' + kgTxt(tf) + ' kg';
    det = p.codigo ? p.codigo : 'operação guardada no aparelho';
  }
  var st;
  if (i.estado === 'enviado') st = i.alerta ? (i.mensagem || 'já estava fechada — confira o peso no app') :
        ((i.repetido ? 'já estava na planilha · ' : 'na planilha · ') + (i.codigos || []).join(', '));
  else if (i.estado === 'recusado') {
    st = 'recusado pela planilha: ' + i.erro;
  } else if (i.aviso) st = 'esperando: ' + i.aviso;
  else st = 'guardado no aparelho · ainda não está na planilha';
  var depRecusado = i.estado === 'guardado' && refsDe(i).some(function(r){ var o = fila.find(function(x){ return x.token === r; }); return o && o.estado === 'recusado'; });
  if (depRecusado) st = 'depende de um lançamento recusado — descarte o recusado e este sai junto';
  return '<li class="' + i.estado + (i.alerta ? ' alerta' : '') + (i.aviso && i.estado === 'guardado' ? ' espera' : '') + '"><b>' + esc(titulo) + '</b>' +
         esc(det + ' · ' + quandoTxt(i.quando, fuso)) + '<div class="st">' + esc(st) + '</div>' +
         ((i.estado === 'recusado' || (i.estado === 'guardado' && i.aviso)) ? '<button class="link" data-descartar="' + esc(i.token) + '">descartar este lançamento</button>' : '') + '</li>';
}

function blocoOperador(db, org, cad){
  var ops = cad.operadores || [], eu = cad.eu && cad.eu.operador, op = db.operador[org.id] || eu || '';
  return '<p class="lbl">Quem está lançando</p><select class="txt" id="sel-op"><option value="">— escolha —</option>' + ops.map(function(o){
    return '<option value="' + esc(o[0]) + '"' + (o[0] === op ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
}

/* ══ ABRIR ═════════════════════════════════════════════════════════════════════════════════ */
function telaAbrir(db){
  var org = orgAtual(), cad = db.cadastros[org.id], f = TELA.form, proj = projecao(db, org);
  var h = '<div class="topo"><button class="link" id="btn-voltar">‹ voltar</button></div><h2>Abrir</h2>';
  if (!(cad.etapas || []).length)
    return h + '<p class="aviso">O aparelho ainda não guardou as etapas desta organização. Volte e toque em «Atualizar cadastros», com sinal.</p>';
  if (!f.etapa)
    return h + '<p class="lbl">Qual etapa vai abrir?</p><div class="grade">' + cad.etapas.map(function(e){
      return '<button class="opc" data-etapa="' + esc(e.id) + '">' + esc(e.nome) + '</button>'; }).join('') + '</div>';
  var et = etapaDeCad(cad, f.etapa), aceitos = Object.keys(aceitosDe(et));
  h += '<div class="faixa"><button class="pill laranja" id="troca-etapa">' + esc(et.nome) + ' ✕</button></div>' +
       (aceitos.length ? '<p class="nota-linha" style="margin:0 0 4px">consome ' + esc(aceitos.slice(0, 2).join(' e ') + (aceitos.length > 2 ? ' e mais ' + (aceitos.length - 2) : '')) + '</p>' : '');
  /* o que já está na operação nunca some da lista (app: viewAbrir, R-491) */
  var lts = lotesElegiveis(cad, proj, f.etapa);
  Object.keys(f.lotes).forEach(function(k){ if (proj.lotes[k] && !lts.some(function(l){ return l.chave === k; })) lts.push(proj.lotes[k]); });
  /* app: `prodTrava` — depois do 1º lote só o MESMO produto é oferecido */
  var trava = null;
  Object.keys(f.lotes).some(function(k){ if (proj.lotes[k]) { trava = proj.lotes[k].produto; return true; } return false; });
  if (trava) lts = lts.filter(function(l){ return l.produto === trava || f.lotes[l.chave]; });
  /* app: PEPS (R-32) — do mais VELHO ao mais novo; o que acabou de chegar ao aparelho fica por último */
  lts = lts.slice().sort(function(a, b){ return (a.codigo ? codData(a.codigo) : '99999999').localeCompare(b.codigo ? codData(b.codigo) : '99999999'); });
  var naOp = lts.filter(function(l){ return !!f.lotes[l.chave]; }), resto = lts.filter(function(l){ return !f.lotes[l.chave]; });
  var max = cad.maxLotes || 8;
  if (naOp.length) {
    h += '<p class="lbl">Na operação · ' + naOp.length + '</p>' + naOp.map(function(l){
      var s = f.lotes[l.chave];
      return '<div class="linha" style="margin-bottom:0"><div class="nome">' + esc(l.produto) + '<small' + (l.local ? ' class="local"' : '') + '>' + esc(rotuloLote(l)) + ' · disponível ' + kgTxt(l.saldo) + ' kg</small></div>' +
        '<input inputmode="decimal" data-kgde="' + esc(l.chave) + '" value="' + esc(s.kg) + '" placeholder="usar"><button class="x" data-tira="' + esc(l.chave) + '" aria-label="tirar">×</button></div>' +
        '<div class="acabou"><input type="checkbox" data-acabou="' + esc(l.chave) + '"' + (s.naoAcabou ? '' : ' checked') + '><span>Acabou</span> ' +
        '<button class="tudo" data-tudo="' + esc(l.chave) + '">todo o lote</button></div><div class="nota" data-nota="' + esc(l.chave) + '"></div>';
    }).join('');
  } else h += '<p class="aviso" style="margin:0 0 4px">Toque num lote abaixo para trazê-lo à operação.</p>';
  h += '<p class="lbl">Disponíveis · ' + resto.length + ' · mais antigo primeiro' + (trava ? ' · só ' + esc(trava) + ' nesta operação' : '') + '</p>';
  h += resto.length ? resto.map(function(l){
    return '<button class="card" data-pega="' + esc(l.chave) + '"><span class="m"><b>' + esc(l.produto) + (l.codigo && dataCurta(l.codigo) ? ' · ' + dataCurta(l.codigo) : '') + '</b>' +
           '<small' + (l.local ? ' class="local"' : '') + '>' + esc(rotuloLote(l)) + '</small></span><span class="kg">' + kgTxt(l.saldo) + ' kg</span><span class="mais">+</span></button>';
  }).join('') : '<p class="aviso" style="margin:0">' + (naOp.length ? 'Nenhum outro lote disponível para esta etapa.' : 'Nenhum lote disponível para esta etapa. Todos estão sem saldo, em operação aberta, ou ainda não chegaram ao aparelho.') + '</p>';
  if (naOp.length >= max) h += '<p class="nota-linha">No máximo ' + max + ' lotes por operação.</p>';
  var tot = naOp.reduce(function(a, l){ return a + numDe(f.lotes[l.chave].kg); }, 0);
  h += '<div class="total">Total que entra: <b id="total">' + kgTxt(tot) + ' kg</b></div>';
  if (ehMov(et)) h += '<p class="aviso" style="margin:0 0 8px">Esta etapa não transforma o produto — ele entra e sai igual. Fecha num gesto só.</p>';
  h += '<p class="lbl">Observação (opcional)</p><input class="txt" id="obs" value="' + esc(f.obs || '') + '" placeholder="algo fora do normal nesta operação">';
  h += blocoOperador(db, org, cad);
  h += '<div style="margin-top:16px"><button class="grande" id="btn-guardar" disabled>Guardar no aparelho</button></div>' +
       '<p class="aviso">Fica guardado neste celular, mesmo sem rede. Vai para a planilha quando você tocar em «Enviar».</p>';
  return h;
}
function podeGuardarAbrir(){
  var f = TELA.form, org = orgAtual(), db = ler(), proj = projecao(db, org), n = 0, ruim = false;
  Object.keys(f.lotes).forEach(function(k){
    var l = proj.lotes[k], v = numDe(f.lotes[k].kg); if (!l) { ruim = true; return; }
    if (v > 0) n++; if (v > l.saldo + 0.01) ruim = true; });
  var sop = document.getElementById('sel-op');
  return { ok: !ruim && n > 0 && !!f.etapa && !!(sop && sop.value), n: n, proj: proj };
}
function atualizarAbrir(){
  var f = TELA.form, g = podeGuardarAbrir(), tot = 0;
  Object.keys(f.lotes).forEach(function(k){
    var l = g.proj.lotes[k], v = numDe(f.lotes[k].kg), el = document.querySelector('[data-nota="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]');
    tot += v; if (!el || !l) return;
    el.className = 'nota';
    if (v > l.saldo + 0.01) { el.className = 'erro-linha'; el.textContent = 'Maior que o disponível — o lote tem ' + kgTxt(l.saldo) + ' kg. Usar parte do lote é normal; usar mais do que existe, não.'; }
    else if (!f.lotes[k].naoAcabou && v > 0 && l.saldo - v > 0.01) { el.className = 'nota-linha'; el.textContent = 'Sobra de ' + kgTxt(arred2(l.saldo - v)) + ' kg do lote será registrada como quebra. Desmarque «Acabou» se a sobra fica no lote.'; }
    else el.textContent = '';
  });
  var t = document.getElementById('total'); if (t) t.textContent = kgTxt(tot) + ' kg';
  var bg = document.getElementById('btn-guardar'); if (bg) bg.disabled = !g.ok;
}
function ligarAbrir(){
  var f = TELA.form, org = orgAtual(), db = ler(), cad = db.cadastros[org.id], proj = projecao(db, org);
  document.getElementById('btn-voltar').onclick = function(){ TELA = { nome:'inicio' }; render(); };
  document.querySelectorAll('[data-etapa]').forEach(function(b){ b.onclick = function(){ f.etapa = b.dataset.etapa; f.lotes = {}; render(); }; });
  var te = document.getElementById('troca-etapa'); if (te) te.onclick = function(){ f.etapa = ''; f.lotes = {}; render(); };
  document.querySelectorAll('[data-pega]').forEach(function(b){ b.onclick = function(){
    if (Object.keys(f.lotes).length >= (cad.maxLotes || 8)) { toast('No máximo ' + (cad.maxLotes || 8) + ' lotes por operação.'); return; }
    var l = proj.lotes[b.dataset.pega]; if (!l) return;
    f.lotes[l.chave] = { kg: String(l.saldo).replace('.', ','), naoAcabou: false };           /* app R-33: sobe CHEIO e «Acabou» marcado */
    render(); }; });
  document.querySelectorAll('[data-tira]').forEach(function(b){ b.onclick = function(){ delete f.lotes[b.dataset.tira]; render(); }; });
  document.querySelectorAll('[data-kgde]').forEach(function(inp){ inp.oninput = function(){ f.lotes[inp.dataset.kgde].kg = inp.value; atualizarAbrir(); }; });
  document.querySelectorAll('[data-acabou]').forEach(function(c){ c.onchange = function(){ f.lotes[c.dataset.acabou].naoAcabou = !c.checked; atualizarAbrir(); }; });
  document.querySelectorAll('[data-tudo]').forEach(function(b){ b.onclick = function(){
    var l = proj.lotes[b.dataset.tudo]; f.lotes[b.dataset.tudo].kg = String(l.saldo).replace('.', ','); render(); }; });
  var obs = document.getElementById('obs'); if (obs) obs.oninput = function(){ f.obs = obs.value; };
  var sop = document.getElementById('sel-op'); if (sop) sop.onchange = function(){ mudar(function(d){ d.operador[org.id] = sop.value; }); atualizarAbrir(); };
  var bg = document.getElementById('btn-guardar'); if (bg) bg.onclick = guardarAbrir;
  atualizarAbrir();
}
function guardarAbrir(){
  var f = TELA.form, org = orgAtual(), db = ler(), cad = db.cadastros[org.id], g = podeGuardarAbrir(), proj = g.proj;
  if (!g.ok) return;
  var op = document.getElementById('sel-op').value, et = etapaDeCad(cad, f.etapa), produto = '', cadeia = '';
  var lotes = Object.keys(f.lotes).filter(function(k){ return numDe(f.lotes[k].kg) > 0; }).map(function(k){
    var l = proj.lotes[k], o = { kg: numDe(f.lotes[k].kg), esgotou: !f.lotes[k].naoAcabou };
    produto = l.produto; cadeia = l.cadeia;
    if (l.codigo) o.codigo = l.codigo; else { o.ref = l.ref; if (temFilho(l)) o.filho = l.filho; }
    return o; });
  var item = { token: novoToken(), tipo: 'abrir', org: org.id, quando: new Date().toISOString(), estado: 'guardado',
    payload: { etapa: f.etapa, etapaNome: et.nome, produto: produto, cadeia: cadeia, operador: op, obs: (f.obs || '').trim(), lotes: lotes } };
  var ultimo = (db.fila || []).filter(function(i){ return i.org === org.id && i.estado === 'guardado'; }).pop();
  if (ultimo && ultimo.tipo === 'abrir' && JSON.stringify(ultimo.payload) === JSON.stringify(item.payload) && Date.now() - Date.parse(ultimo.quando) < 60000) {
    toast('Essa operação já está guardada.'); TELA = { nome:'inicio' }; render(); return;
  }
  var ok = mudar(function(d){ d.fila.push(item); d.operador[org.id] = op; });
  var confere = ok && ler().fila.some(function(i){ return i.token === item.token; });
  if (!confere) { toast('O aparelho NÃO guardou (sem espaço ou modo privado). Anote no papel.'); return; }
  TELA = { nome:'inicio' }; render();
  toast('Guardado no aparelho ✓ — ainda não está na planilha.');
}

/* ══ FECHAR ════════════════════════════════════════════════════════════════════════════════ */
function rotuloOp(o){ return o.codigo ? o.codigo : 'guardada no aparelho · ainda sem código'; }
function telaFechar(db){
  var org = orgAtual(), cad = db.cadastros[org.id], f = TELA.form, proj = projecao(db, org);
  var h = '<div class="topo"><button class="link" id="btn-voltar">‹ voltar</button></div><h2>Fechar</h2>';
  var op = f.op ? proj.abertas[f.op] : null;
  if (!op) {
    var ops = proj.alista.map(function(k){ return proj.abertas[k]; });
    return h + (ops.length ? '<p class="lbl">Qual operação terminou?</p>' + ops.map(function(o){
      return '<button class="card" data-op="' + esc(o.chave) + '"><span class="m"><b>' + esc(nomeDaEtapa(cad, o.etapa)) + ' · ' + esc(o.produto) + '</b>' +
             '<small' + (o.local ? ' class="local"' : '') + '>' + esc(rotuloOp(o)) + '</small></span><span class="kg">' + kgTxt(o.kg) + ' kg</span><span class="mais">›</span></button>';
    }).join('') : '<p class="aviso">Nenhuma operação aberta no aparelho. Se você abriu uma, toque em «Atualizar cadastros», com sinal, para ela aparecer aqui.</p>');
  }
  var et = etapaDeCad(cad, op.etapa), cfg = cfgDe(et, op.cadeia, op.produto);
  var multi = !!(cfg && (cfg[3] || cfg[4] || cfg[5]));
  h += '<div class="faixa"><button class="pill laranja" id="troca-op">' + esc(nomeDaEtapa(cad, op.etapa)) + ' · ' + esc(op.codigo || 'guardada no aparelho') + ' ✕</button></div>' +
       '<p class="nota-linha" style="margin:0 0 8px">entrou ' + kgTxt(op.kg) + ' kg de ' + esc(op.produto) + '</p>';
  var linha = function(nome, papel, attr, val){
    return '<div class="linha"><div class="nome">' + esc(nome) + '<small>' + esc(papel) + '</small></div>' +
           '<input inputmode="decimal" ' + attr + ' value="' + esc(val) + '" placeholder="kg"></div>'; };
  if (multi) {
    h += '<p class="lbl">O que saiu</p>' + linha((cfg && cfg[2]) || op.produto, 'principal', 'data-pprinc="1"', f.principal);
    [cfg[3], cfg[4], cfg[5]].forEach(function(sn, k){ if (sn) h += linha(sn, 'subproduto', 'data-psub="' + k + '"', f.subs[k]); });
  } else {
    h += '<p class="lbl">Peso que saiu</p>' + linha((cfg && cfg[2]) || op.produto, 'saída única', 'data-psaida="1"', f.pesoSaida);
  }
  h += '<div class="total">Saiu: <b id="saiu">0 kg</b> <span id="quebra" class="nota-linha"></span></div><div id="aviso-saida"></div>';
  h += '<p class="lbl">Observação (opcional)</p><input class="txt" id="obs" value="' + esc(f.obs || '') + '" placeholder="algo fora do normal">';
  h += blocoOperador(db, org, cad);
  h += '<div style="margin-top:16px"><button class="grande" id="btn-guardar" disabled>Guardar no aparelho</button></div>' +
       '<p class="aviso">Fica guardado neste celular, mesmo sem rede. Quem confere o peso é a planilha, quando você tocar em «Enviar».</p>';
  return h;
}
function saiuDoFechar(multi){
  var f = TELA.form;
  if (multi) return (numDe(f.principal) || 0) + f.subs.reduce(function(a, x){ return a + (numDe(x) || 0); }, 0);
  return numDe(f.pesoSaida) || 0;
}
function atualizarFechar(){
  var f = TELA.form, org = orgAtual(), db = ler(), cad = db.cadastros[org.id], op = projecao(db, org).abertas[f.op]; if (!op) return;
  var et = etapaDeCad(cad, op.etapa), cfg = cfgDe(et, op.cadeia, op.produto), multi = !!(cfg && (cfg[3] || cfg[4] || cfg[5]));
  var saiu = saiuDoFechar(multi), sop = document.getElementById('sel-op');
  document.getElementById('saiu').textContent = kgTxt(saiu) + ' kg';
  var q = document.getElementById('quebra');
  q.textContent = (saiu > 0 && saiu <= op.kg + 0.01) ? '· quebra de ' + kgTxt(arred2(op.kg - saiu)) + ' kg' : '';
  var av = document.getElementById('aviso-saida');
  /* AVISA, não trava: quem barra saída > entrada é o servidor (rendimento acima de 100% é impossível) */
  av.innerHTML = saiu > op.kg + 0.01 ? '<div class="aviso-saida">⚠️ A saída (' + kgTxt(saiu) + ' kg) passa da entrada (' + kgTxt(op.kg) + ' kg). A planilha vai recusar — confira os pesos. Se estiver certo, guarde assim mesmo.</div>' : '';
  document.getElementById('btn-guardar').disabled = !(saiu > 0 && sop && sop.value);
}
function ligarFechar(){
  var f = TELA.form, org = orgAtual();
  document.getElementById('btn-voltar').onclick = function(){ TELA = { nome:'inicio' }; render(); };
  document.querySelectorAll('[data-op]').forEach(function(b){ b.onclick = function(){ f.op = b.dataset.op; f.pesoSaida = ''; f.principal = ''; f.subs = ['','','']; render(); }; });
  var to = document.getElementById('troca-op'); if (to) to.onclick = function(){ f.op = ''; render(); };
  var ps = document.querySelector('[data-psaida]'); if (ps) ps.oninput = function(){ f.pesoSaida = ps.value; atualizarFechar(); };
  var pp = document.querySelector('[data-pprinc]'); if (pp) pp.oninput = function(){ f.principal = pp.value; atualizarFechar(); };
  document.querySelectorAll('[data-psub]').forEach(function(inp){ inp.oninput = function(){ f.subs[+inp.dataset.psub] = inp.value; atualizarFechar(); }; });
  var obs = document.getElementById('obs'); if (obs) obs.oninput = function(){ f.obs = obs.value; };
  var sop = document.getElementById('sel-op'); if (sop) sop.onchange = function(){ mudar(function(d){ d.operador[org.id] = sop.value; }); atualizarFechar(); };
  var bg = document.getElementById('btn-guardar'); if (bg) bg.onclick = guardarFechar;
  if (f.op) atualizarFechar();
}
function guardarFechar(){
  var f = TELA.form, org = orgAtual(), db = ler(), cad = db.cadastros[org.id], op = projecao(db, org).abertas[f.op]; if (!op) return;
  var et = etapaDeCad(cad, op.etapa), cfg = cfgDe(et, op.cadeia, op.produto), multi = !!(cfg && (cfg[3] || cfg[4] || cfg[5]));
  var sop = document.getElementById('sel-op').value; if (!sop || !(saiuDoFechar(multi) > 0)) return;
  var p = { etapa: op.etapa, etapaNome: et ? et.nome : op.etapa, produtoEntrada: op.produto, cadeia: op.cadeia, operador: sop, obs: (f.obs || '').trim() };
  if (op.codigo) p.codigo = op.codigo; else p.ref = op.ref;
  if (multi) {                                                                         /* app: salvarFechar — principal + até 3 subprodutos com peso */
    p.principal = { produto: (cfg && cfg[2]) || op.produto, kg: numDe(f.principal) || 0 };
    p.subprodutos = [];
    [cfg[3], cfg[4], cfg[5]].forEach(function(sn, k){ if (sn && (numDe(f.subs[k]) || 0) > 0) p.subprodutos.push({ produto: sn, kg: numDe(f.subs[k]) }); });
  } else { p.pesoSaida = numDe(f.pesoSaida) || 0; p.produtoSaida = (cfg && cfg[2]) || op.produto || ''; }
  var item = { token: novoToken(), tipo: 'fechar', org: org.id, quando: new Date().toISOString(), estado: 'guardado', payload: p };
  var ultimo = (db.fila || []).filter(function(i){ return i.org === org.id && i.estado === 'guardado'; }).pop();
  if (ultimo && ultimo.tipo === 'fechar' && JSON.stringify(ultimo.payload) === JSON.stringify(item.payload) && Date.now() - Date.parse(ultimo.quando) < 60000) {
    toast('Esse fechamento já está guardado.'); TELA = { nome:'inicio' }; render(); return;
  }
  var ok = mudar(function(d){ d.fila.push(item); d.operador[org.id] = sop; });
  var confere = ok && ler().fila.some(function(i){ return i.token === item.token; });
  if (!confere) { toast('O aparelho NÃO guardou (sem espaço ou modo privado). Anote no papel.'); return; }
  TELA = { nome:'inicio' }; render();
  toast('Guardado no aparelho ✓ — ainda não está na planilha.');
}

/* ── RECEBER simplificado: comunidade → produto → famílias e peso ─────────── */
function semAcento(t){ return String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
/* as famílias da comunidade escolhida — pelo ID ou pelo NOME (o cadastro antigo guarda o nome: D-167) — em ordem alfabética */
function familiasDaComunidade(cad, idCom, com){
  return (cad.familias || []).filter(function(fa){ return fa[2] === idCom || (com && fa[2] === com[1]); })
    .sort(function(a, b){ return String(a[1]).localeCompare(String(b[1]), 'pt-BR'); });
}
function telaReceber(db){
  var org = orgAtual(), cad = db.cadastros[org.id], f = TELA.form;
  var h = '<div class="topo"><button class="link" id="btn-voltar">‹ voltar</button></div><h2>Receber</h2>';
  var com = cad.comunidades.find(function(c){ return c[0] === f.comunidade; });
  if (!f.comunidade) {
    return h + '<p class="lbl">De qual comunidade?</p><div class="grade">' + cad.comunidades.map(function(c){
      return '<button class="opc" data-com="' + esc(c[0]) + '">' + esc(c[1]) + '</button>'; }).join('') + '</div>';
  }
  h += '<div class="faixa"><button class="pill laranja" id="troca-com">' + esc(com ? com[1] : f.comunidade) + ' ✕</button>' +
       (f.produto ? '<button class="pill laranja" id="troca-prod">' + esc(f.produto) + ' ✕</button>' : '') + '</div>';
  if (!f.produto) {
    return h + '<p class="lbl">Qual produto está entrando?</p><div class="grade">' + cad.materias.map(function(m){
      return '<button class="opc" data-prod="' + esc(m[0]) + '">' + esc(m[0]) + '</button>'; }).join('') + '</div>';
  }
  /* OFF3 · a LISTA das famílias da comunidade (com caixa para marcar); a busca é só FILTRO, sem acento e sem maiúscula */
  var daCom = familiasDaComunidade(cad, f.comunidade, com);
  var ja = f.itens.map(function(i){ return i.familia; });
  var q = (f.busca || '').trim(), qn = semAcento(q);
  var restantes = daCom.filter(function(fa){ return ja.indexOf(fa[0]) < 0; });
  var lista = restantes.filter(function(fa){ return !qn || semAcento(fa[1]).indexOf(qn) >= 0; });
  h += '<p class="lbl">Famílias e peso' + (f.itens.length ? ' · ' + f.itens.length + ' marcada(s)' : '') + '</p>';
  h += f.itens.map(function(it, k){
    return '<div class="linha"><div class="nome">' + esc(it.nome) + (it.nova ? '<small>família nova · o gestor completa o cadastro</small>' : '') + '</div>' +
           '<input inputmode="decimal" data-kg="' + k + '" value="' + esc(it.kg) + '" placeholder="kg"><button class="x" data-tira="' + k + '" aria-label="tirar">×</button></div>';
  }).join('');
  h += '<p class="lbl">Marcar famílias de ' + esc(com ? com[1] : '') + ' · ' + lista.length + (q ? ' de ' + restantes.length : '') + '</p>' +
       '<input class="txt" id="busca" type="search" placeholder="filtrar pelo nome (sem acento)" value="' + esc(f.busca || '') + '" autocomplete="off">' +
       '<div class="lista-fam" id="lista-fam" role="group" aria-label="Famílias da comunidade">' +
       (lista.length ? lista.map(function(fa){ return '<label class="fam"><input type="checkbox" data-fam="' + esc(fa[0]) + '"><span>' + esc(fa[1]) + '</span></label>'; }).join('')
         : '<div class="vazio-fam">' + (q ? 'Nenhuma família com «' + esc(q) + '» nesta comunidade.' : (daCom.length ? 'Todas as famílias da comunidade já estão marcadas.' : 'Nenhuma família cadastrada nesta comunidade.')) + '</div>') + '</div>';
  h += '<div class="sug">' + (q && !daCom.some(function(fa){ return semAcento(fa[1]) === qn; }) && !f.itens.some(function(i){ return semAcento(i.nome) === qn; })
       ? '<button class="nova" id="fam-nova">+ família nova: «' + esc(q) + '»</button>' : '') + '</div>';
  var total = f.itens.reduce(function(a,i){ return a + numDe(i.kg); }, 0);
  var pronto = f.itens.length > 0 && f.itens.every(function(i){ return numDe(i.kg) > 0; });
  h += '<div class="total">Total que entra: <b id="total">' + kgTxt(total) + ' kg</b></div>';
  h += '<p class="lbl">Observação (opcional)</p><input class="txt" id="obs" value="' + esc(f.obs || '') + '" placeholder="algo fora do normal nesta entrega">';
  var ops = cad.operadores || [], eu = cad.eu && cad.eu.operador;
  var op = db.operador[org.id] || eu || '';
  h += '<p class="lbl">Quem está lançando</p><select class="txt" id="sel-op"><option value="">— escolha —</option>' + ops.map(function(o){
    return '<option value="' + esc(o[0]) + '"' + (o[0] === op ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  h += '<div style="margin-top:16px"><button class="grande" id="btn-guardar"' + (pronto && op ? '' : ' disabled') + '>Guardar no aparelho</button></div>' +
       '<p class="aviso">Fica guardado neste celular, mesmo sem rede e mesmo se fechar a página. Vai para a planilha quando você tocar em «Enviar».</p>';
  return h;
}

function ligarReceber(){
  var f = TELA.form, org = orgAtual();
  document.getElementById('btn-voltar').onclick = function(){ TELA = { nome:'inicio' }; render(); };
  document.querySelectorAll('[data-com]').forEach(function(b){ b.onclick = function(){ f.comunidade = b.dataset.com; f.itens = []; render(); }; });
  document.querySelectorAll('[data-prod]').forEach(function(b){ b.onclick = function(){ f.produto = b.dataset.prod; render(); }; });
  var tc = document.getElementById('troca-com'); if (tc) tc.onclick = function(){ f.comunidade = ''; f.produto = ''; f.itens = []; render(); };
  var tp = document.getElementById('troca-prod'); if (tp) tp.onclick = function(){ f.produto = ''; render(); };
  var busca = document.getElementById('busca');
  if (busca) {
    busca.oninput = function(){ f.busca = busca.value; var pos = busca.selectionStart; render(); var b2 = document.getElementById('busca'); b2.focus(); b2.setSelectionRange(pos, pos); };
    if (f._focoBusca) { busca.focus(); f._focoBusca = false; }
  }
  var cad = ler().cadastros[org.id];
  document.querySelectorAll('[data-fam]').forEach(function(b){ b.onchange = function(){
    if (!b.checked) return;
    var fa = cad.familias.find(function(x){ return x[0] === b.dataset.fam; });
    var lf = document.getElementById('lista-fam'), rolou = lf ? lf.scrollTop : 0;      /* marcar não leva a lista de volta ao topo */
    f.itens.push({ familia: fa[0], nome: fa[1], kg:'' }); render();
    var lf2 = document.getElementById('lista-fam'); if (lf2) lf2.scrollTop = rolou; }; });
  var fn = document.getElementById('fam-nova'); if (fn) fn.onclick = function(){
    var nome = f.busca.trim(); f.itens.push({ familia: 'NOVA:' + nome, nome: nome, kg:'', nova:true }); f.busca = ''; render(); };
  document.querySelectorAll('[data-kg]').forEach(function(inp){ inp.oninput = function(){
    f.itens[+inp.dataset.kg].kg = inp.value;
    document.getElementById('total').textContent = kgTxt(f.itens.reduce(function(a,i){ return a + numDe(i.kg); }, 0)) + ' kg';
    atualizarGuardar(); }; });
  document.querySelectorAll('[data-tira]').forEach(function(b){ b.onclick = function(){ f.itens.splice(+b.dataset.tira, 1); render(); }; });
  var obs = document.getElementById('obs'); if (obs) obs.oninput = function(){ f.obs = obs.value; };
  var sop = document.getElementById('sel-op'); if (sop) sop.onchange = function(){ mudar(function(db){ db.operador[org.id] = sop.value; }); atualizarGuardar(); };
  var bg = document.getElementById('btn-guardar'); if (bg) bg.onclick = guardar;
}
function atualizarGuardar(){
  var f = TELA.form, bg = document.getElementById('btn-guardar'), sop = document.getElementById('sel-op'); if (!bg) return;
  bg.disabled = !(f.itens.length && f.itens.every(function(i){ return numDe(i.kg) > 0; }) && sop && sop.value);
}

function guardar(){
  var f = TELA.form, org = orgAtual(), db = ler(), cad = db.cadastros[org.id];
  var op = document.getElementById('sel-op').value;
  var com = cad.comunidades.find(function(c){ return c[0] === f.comunidade; });
  var item = {
    token: novoToken(), tipo: 'receber', org: org.id, quando: new Date().toISOString(), estado: 'guardado',
    payload: { operador: op, comunidade: f.comunidade, comunidadeNome: com ? com[1] : '', produto: f.produto,
      itens: f.itens.map(function(i){ return { familia: i.familia, nome: i.nome, kg: numDe(i.kg), obs: (f.obs || '').trim() }; }) }
  };
  /* clique duplo: o mesmo conteúdo do último guardado não vira segundo lançamento (referência 08 §4.1) */
  var ultimo = (db.fila || []).filter(function(i){ return i.org === org.id && i.estado === 'guardado'; }).pop();
  if (ultimo && JSON.stringify(ultimo.payload) === JSON.stringify(item.payload) && Date.now() - Date.parse(ultimo.quando) < 60000) {
    toast('Esse lançamento já está guardado.'); TELA = { nome:'inicio' }; render(); return;
  }
  var ok = mudar(function(d){ d.fila.push(item); d.operador[org.id] = op; });
  var confere = ok && ler().fila.some(function(i){ return i.token === item.token; });   // lê de volta: guardar que não lança não é guardar que deu certo
  if (!confere) { toast('O aparelho NÃO guardou (sem espaço ou modo privado). Anote no papel.'); return; }
  TELA = { nome:'inicio' }; render();
  toast('Guardado no aparelho ✓ — ainda não está na planilha.');
}

window.addEventListener('online', function(){ if (TELA.nome === 'inicio') render(); });
window.addEventListener('offline', function(){ if (TELA.nome === 'inicio') render(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
lerRetorno();
render();
