<style>
  :root{--orange:#FF6E00;--orange-dark:#B24D00;--orange-bg:#FFF5EE;--navy:#0E2A47;--bg:#F7F8FA;--text:#1A1A1A;--text2:#5A6472;--line:#E3E6EB;--ok:#1E7A46;--ok-bg:#EAF6EF;--erro:#B3261E;--erro-bg:#FCEDEC}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:Ubuntu,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:16px 16px 40px;font-size:16px}
  .cartao{max-width:460px;margin:0 auto;background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 2px 24px rgba(14,42,71,.10)}
  header{display:flex;align-items:center;gap:12px;margin:0 0 16px}

  h2{margin:0 0 12px;font-size:18px}
  .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:18px 0 8px}
  label.chave{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer}

  .orgs{display:flex;flex-direction:column;gap:10px}

  a.org .n{font-weight:700;display:block} a.org .d{font-size:13px;color:var(--text2);display:block}

  .faixa{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .pill{font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;background:var(--bg);color:var(--text2)}

  ul.fila li.espera{border-color:var(--text2)} li.espera .st{color:var(--text2)}

  .card .kg{font-weight:700;font-size:16px;white-space:nowrap} .card .mais{border:1.5px solid var(--orange);color:var(--orange-dark);border-radius:8px;padding:6px 12px;font-weight:700;font-size:18px;background:#fff}
  .local{color:var(--orange-dark)!important;font-weight:700}
  .erro-linha{font-size:12px;color:var(--erro);margin:4px 0 0}
  .nota-linha{font-size:12px;color:var(--text2);margin:4px 0 0}
  .acabou{display:flex;align-items:center;gap:6px;font-size:13px;margin:6px 0 0} .acabou input{width:20px;height:20px;accent-color:var(--orange)}
  .aviso-saida{font-size:13px;background:var(--orange-bg);border:1.5px solid var(--orange);border-radius:10px;padding:10px;margin:10px 0 0;line-height:1.4}

  .ficha{border:1.5px solid var(--line);border-left:4px solid var(--orange);border-radius:12px;padding:14px;margin:0 0 12px}

<script>
/* ── LANÇADORA ÚNICA (19/10/2026) · base: a lançadora OFICIAL com versão offline (15/10/2026, da de teste de 30/09/2026) ─
 * FONTE ÚNICA (19/10/2026): este arquivo, na pasta `unica/` do repositório `lancadora` (tsferraro/estoque). O ZIP da plataforma sai dele pelo
 * `lancadora/scripts/gerar-zip.sh`; não há outra cópia. Endereço único: https://mandu-apps.lp.agentesamanda.com/gestao-operacional/ (sempre com a barra).
 * Nome do app (H10-290): Sistema de Gestão Operacional · versão curta SGO Mandū.
 * O que muda da Oficial está nos blocos «LU» (lista em arquivo, lista de seleção, sub-lançadora, painel do administrador, sonda).
 *
 * Handoff `camtaua/working/HANDOFF-2026-09-30_offline-e-lancadora.md` · H10-59.
 *
 * A invariante do padrão da casa (webapp-mandu, referência 08 «fila
 * offline-first»): NADA TOCA A REDE ANTES DE ESTAR GUARDADO NO APARELHO, e a
 * tela confirma a GRAVAÇÃO, nunca o envio. «Guardado no aparelho» ≠ «na
 * planilha» — só o retorno do servidor muda para «na planilha · REC-…».
 *
 * O ENVIO É UMA NAVEGAÇÃO, NÃO UM fetch. O app roda como quem acessa
 * (USER_ACCESSING): só uma navegação de topo leva o login Google. A fila vai
 * no fragmento (#f=…) para `/exec?modo=sincronizar`; a página de lá grava pelo
 * google.script.run e devolve os resultados no fragmento desta (#r=…).
 * Reenviar é seguro: o servidor deduplica pelo token do gesto (R-411). */

/* ═══ LU · A LISTA DE ORGANIZAÇÕES (19/10/2026) ═══════════════════════════════════════════════════════
 * ► ONDE EDITAR A LISTA: no arquivo `organizacoes.json`, ao lado desta página (um único bloco de dado: o array `"organizacoes"` no topo do arquivo).
 *   Hoje: Camtauá (grupo «organizacoes», a real), Demo Camtauá e Teste Felipe (grupo «testes»), mais a base antiga de produção (`listada:false`,
 *   histórico, nunca é zerada). Para acrescentar as 5 versões do H10-279: uma linha nova no array (id, nome, nomeAdmin, local, grupo, ambiente,
 *   estado, estadoTxt, deployment = código do /exec, apelidos, listada, historico) e gerar o ZIP de novo (`lancadora/scripts/gerar-zip.sh`).
 *   Quem aparece para quem: grupo «organizacoes» + `listada:true` aparece para QUALQUER aparelho na 1ª visita; grupo «testes» só no modo administrador
 *   (ou no aparelho que recebeu o link daquela organização).
 * Na Oficial a lista estava escrita aqui dentro (`ORGS`). Na lançadora ÚNICA ela mora no arquivo `organizacoes.json`, ao lado desta
 * página, dentro do ZIP (opção (a), decidida 18/10): organização nova = linha nova no arquivo + ZIP novo; nenhum link nem QR muda.
 * O arquivo é lido a cada abertura com sinal e a última cópia boa fica guardada no aparelho — a lista abre sem rede.
 * `deployment` é o código do /exec; a forma longa do endereço (…/a/macros/mandusocial.org/s/<código>/exec) é montada aqui
 * (a curta abre a conta errada). Código `PREENCHER_…` = organização que ainda não tem app: aparece, mas diz «aguardando o app». */
var ORGS = [];
var CFG = { enderecoBase:'', execModelo:'https://script.google.com/a/macros/mandusocial.org/s/{deployment}/exec', administradores:[] };
var LISTA_ORIGEM = '';                         /* 'arquivo' (veio agora) · 'aparelho' (última cópia guardada) · 'nenhuma' */
var CHAVE_LISTA = 'lu_organizacoes_v1';
var AMB_TXT = { producao:'Produção', demonstracao:'Demonstração', teste:'Teste' };
function execDe(dep){ dep = String(dep == null ? '' : dep).trim(); if (!dep || /^PREENCHER/i.test(dep)) return ''; return String(CFG.execModelo).replace('{deployment}', dep); }
/* PROJETO ÚNICO (D35, c9): junta um parâmetro ao endereço com `?` ou `&`, conforme já houver `?` (`…/exec/x` + `modo=sincronizar` → `…/exec/x?modo=sincronizar`) */
function juntaParam(u, kv){ u = String(u || ''); return u + (u.indexOf('?') < 0 ? '?' : '&') + kv; }
function montarLista(j){
  if (!j || !Array.isArray(j.organizacoes) || !j.organizacoes.length) return false;
  if (j.execModelo) CFG.execModelo = String(j.execModelo);
  var lista = [];
  j.organizacoes.forEach(function(r){
    if (!r || !/^[a-z0-9]+(-[a-z0-9]+)*$/.test(String(r.id || ''))) return;
    /* PROJETO ÚNICO (D35, c9): com `deploymentUnico` e `orgApp` (o id no registro do projeto único) valendo, o endereço do app é o do ÚNICO com `/<org>` (`…/exec/<org>`);
       o `deployment` antigo vira RESERVA (`urlReserva`). Sem os dois, tudo como antes. */
    var app = String(r.orgApp || '').trim().toLowerCase(), depU = execDe(r.deploymentUnico);
    var unico = !!depU && /^[a-z0-9]+(-[a-z0-9]+)*$/.test(app);
    var reserva = execDe(r.deployment);
    var exec = unico ? depU + '/' + encodeURIComponent(app) : reserva;      /* …/exec/<org>: a organização no CAMINHO (o servidor lê `pathInfo`; `?org=` continua aceito lá) */
    lista.push({ id:r.id, nomeCoop:r.nome || r.id, nomeAdm:r.nomeAdmin || r.nome || r.id, nome:r.nome || r.id, desc:r.local || '', local:r.local || '',
      grupo: r.grupo === 'testes' ? 'testes' : 'organizacoes', ambiente:r.ambiente || 'teste', estado:r.estado || 'uso', estadoTxt:r.estadoTxt || '',
      apelidos:(r.apelidos || []).map(function(a){ return String(a).toLowerCase(); }), listada: r.listada !== false, historico: !!r.historico,
      pendente: !exec, url:exec, offline:exec, orgApp: unico ? app : '', unico: unico, urlReserva: reserva });
  });
  if (!lista.length) return false;
  CFG.enderecoBase = String(j.enderecoBase || '');
  CFG.administradores = Array.isArray(j.administradores) ? j.administradores : [];
  ORGS = lista; return true;
}
function carregarOrgs(){
  return fetch('organizacoes.json', { cache:'no-store' })
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.text(); })
    .then(function(t){ if (!montarLista(JSON.parse(t))) throw new Error('lista vazia'); try { localStorage.setItem(CHAVE_LISTA, t); } catch(e){} LISTA_ORIGEM = 'arquivo'; })
    .catch(function(){
      var t = null; try { t = localStorage.getItem(CHAVE_LISTA); } catch(e){}
      try { LISTA_ORIGEM = (t && montarLista(JSON.parse(t))) ? 'aparelho' : 'nenhuma'; } catch(e){ LISTA_ORIGEM = 'nenhuma'; }
    });
}
/* o id, ou um nome antigo que continua valendo para sempre (`demo`, `felipe`, `teste-limpo`): QR impresso não quebra */
function achaOrg(id){
  var k = String(id == null ? '' : id).trim().toLowerCase(); if (!k) return null;
  return ORGS.find(function(o){ return o.id === k; }) || ORGS.find(function(o){ return o.apelidos.indexOf(k) >= 0; }) || null;
}

/* ── armazenamento: uma chave versionada, lida e gravada inteira (sem await
   no meio, então não há retrato velho para gravar por cima — referência 08 §6.2) */
var CHAVE = 'estoque_offline_v1';
function ler(){ try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; } catch(e){ return {}; } }
function gravar(db){
  try { localStorage.setItem(CHAVE, JSON.stringify(db)); return localStorage.getItem(CHAVE) === JSON.stringify(db); }
  catch(e){ return false; }          // cota estourada ou modo privado: a tela PRECISA dizer
}
function mudar(fn){ var db = ler(); db.fila = db.fila || []; db.cadastros = db.cadastros || {}; db.operador = db.operador || {}; fn(db); return gravar(db); }
function novoToken(){ return (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2)); }

function b64url(t){ return btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function deB64url(s){ s = String(s).replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; return decodeURIComponent(escape(atob(s))); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
/* CON-c9 · M7 (H10-361: «Eu não quero ter que pedir esta mesma correção pela 10ª vez!») · «1SUB» NÃO APARECE PARA QUEM LANÇA. A CHAVE gravada (planilha, QR, fila, fichas) continua
   `1SUB-AAAAMMDD-NNN`; a TELA escreve `SUB-AAAAMMDD-NNN`. A mesma troca do app (`codigoExibicao`/`textoVisivel_` do index.html do app), aplicada NA SAÍDA: toda tela (`render`),
   cada faixa que se repinta (`balanço`, envio automático) e o `toast` passam por ela; `textoVisivel_` só toca nos NÓS DE TEXTO e nos atributos que se leem (title, aria-label,
   placeholder) — `data-*`, `value` e `href` ficam com a chave. Portão: `scripts/teste-unico.js`. */
function codigoExibicao(cod){ return String(cod == null ? '' : cod).replace(/(^|[^A-Za-z0-9])1SUB-/g, '$1SUB-'); }
function textoVisivel_(h){
  h = String(h == null ? '' : h);
  if (h.indexOf('1SUB-') < 0) return h;
  return h.split(/(<[^>]*>)/).map(function(p, i){
    return i % 2 === 0 ? codigoExibicao(p) : p.replace(/\b(?:title|aria-label|placeholder)="[^"]*"/g, codigoExibicao);
  }).join('');
}
function kgTxt(n){ return Number(n||0).toLocaleString('pt-BR',{maximumFractionDigits:2}); }
/* ADR-031: separador seguido de EXATAMENTE 3 dígitos é milhar; outra contagem é decimal. */
function numDe(v){
  var s = String(v == null ? '' : v).trim().replace(/\s/g,''); if (!s) return 0;
  var sep = s.match(/[.,]/g) || [];
  if (sep.length > 1) { var ult = Math.max(s.lastIndexOf(','), s.lastIndexOf('.')); s = s.slice(0,ult).replace(/[.,]/g,'') + '.' + s.slice(ult+1); }
  else if (sep.length === 1) { var p = s.split(/[.,]/); s = p[1].length === 3 ? p[0] + p[1] : p[0] + '.' + p[1]; }
  var n = Number(s); return isFinite(n) ? n : 0;
}
/* OFF2 · a hora que a tela mostra é a da ORGANIZAÇÃO (`cadastros.fuso`), não a do celular:
   o iPhone na França mostrava 14:24 para um gesto que na planilha é 09:24. */
var FUSO_PADRAO = 'America/Sao_Paulo';
function quandoTxt(iso, fuso){
  var o = {day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'};
  try { o.timeZone = fuso || FUSO_PADRAO; return new Date(iso).toLocaleString('pt-BR', o); }
  catch(e){ delete o.timeZone; return new Date(iso).toLocaleString('pt-BR', o); }
}
function toast(msg){ var t = document.getElementById('toast'); t.textContent = codigoExibicao(msg); t.style.display = 'block'; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.style.display = 'none'; }, 4200); }

var TELA = { nome:'inicio', form:null };
var ultima = null; try { ultima = localStorage.getItem('estoque_org'); } catch(e){}

/* OFF-13 · no iPhone o ícone da tela de início e o navegador guardam filas SEPARADAS (medido 07/10): quem lança no navegador
   vê «Nada lançado» no ícone. Fora do modo ícone, o Início avisa em UMA linha; no modo ícone o aviso nem existe no DOM. */

/* ── RETORNO do /exec?modo=sincronizar (#r=…) ─────────────────────────────── */
function lerRetorno(){
  var h = location.hash; if (h.indexOf('#r=') !== 0) return;
  history.replaceState(null, '', location.pathname + location.search);
  sess('estoque_auto', 'tentou');                                  /* OFF5 · B6 · voltou do envio: o automático não tenta de novo nesta volta da rede */
  var r; try { r = JSON.parse(deB64url(h.slice(3))); } catch(e){ toast('O retorno do envio veio ilegível — nada foi marcado; envie de novo.'); return; }
  var ok = 0, rec = 0, espera = 0;
  var gravou = mudar(function(db){
    (r.resultados || []).forEach(function(res){
      var it = db.fila.find(function(i){ return i.token === res.token; }); if (!it) return;
      it.mensagem = res.mensagem || '';
      if (res.pendente) { it.estado = 'guardado'; it.aviso = res.mensagem || ''; espera++; }                 /* fica na fila: NÃO é recusa */
      else if (res.ok) { it.estado = 'enviado'; it.codigos = res.codigos || []; it.codigo = res.codigo || (res.codigos||[])[0] || ''; it.filhos = res.filhos || [];
                         it.repetido = !!res.repetido; it.alerta = !!res.jaFechada; it.enviadoEm = r.quando; it.erro = ''; it.aviso = ''; ok++; }
      else { it.estado = 'recusado'; it.erro = res.erro || 'recusado'; it.aviso = ''; rec++; }
    });
    trocarRefs(db);
    db.cadVelho = db.cadVelho || {};
    if (r.cadastros) { db.cadastros[r.org] = r.cadastros; db.cadVelho[r.org] = false; }
    else if (ok) db.cadVelho[r.org] = true;                   /* OFF3 · entrou item e os cadastros não vieram: o retrato do aparelho ficou velho */
    db.orgOffline = r.org;
    /* poda: só o JÁ ENVIADO sai, e só depois de 30 dias. Pendente nunca sai sozinho. */
    db.fila = db.fila.filter(function(i){ return i.estado !== 'enviado' || Date.now() - Date.parse(i.enviadoEm || i.quando) < 30 * 864e5; });
  });
  toast(!gravou ? 'O aparelho recusou guardar o retorno — confira o espaço livre.' :
        (r.resultados||[]).length ? (ok + ' na planilha' + (rec ? ' · ' + rec + ' recusado(s)' : '') + (espera ? ' · ' + espera + ' esperando a origem' : '') + (r.cadastros ? ' · cadastros atualizados' : ' · cadastros NÃO atualizados — toque em «Atualizar cadastros»')) :
        'Modo offline preparado · cadastros guardados no aparelho');
}

/* ── OFF2 · REF: o item que aponta para outro (`ref` = token do item de origem) ──────────────
   Depois que a origem ENTRA na planilha ela ganha código real, e o dependente que ainda não foi
   enviado passa a apontar para o código (a lançadora guarda o código que voltou). */
function temFilho(l){ return l.filho !== undefined && l.filho !== null && l.filho !== ''; }
function codDoFilho(filhos, filho){ var f = (filhos || []).find(function(x){ return String(x.filho) === String(filho); }); return f ? f.codigo : ''; }
function trocarRefs(db){
  var cod = {}, fil = {};
  db.fila.forEach(function(i){ if (i.estado === 'enviado') { var c = i.codigo || (i.codigos || [])[0]; if (c) { cod[i.token] = c; fil[i.token] = i.filhos || []; } } });
  db.fila.forEach(function(i){
    if (i.estado === 'enviado') return;
    var p = i.payload || {};
    /* OFF3 · `{ref, filho}` aponta para o lote que um FECHAR gerou: troca pelo código do filho que voltou */
    if (i.tipo === 'abrir') (p.lotes || []).forEach(function(l){
      if (!l.ref || !cod[l.ref]) return;
      var c = temFilho(l) ? codDoFilho(fil[l.ref], l.filho) : cod[l.ref];
      if (c) { l.codigo = c; delete l.ref; delete l.filho; } });
    if (i.tipo === 'fechar' && p.ref && cod[p.ref]) { p.codigo = cod[p.ref]; delete p.ref; }
  });
}
function refsDe(i){
  var p = i.payload || {}, r = [];
  if (i.tipo === 'abrir') (p.lotes || []).forEach(function(l){ if (l.ref) r.push(l.ref); });
  if (i.tipo === 'fechar' && p.ref) r.push(p.ref);
  return r;
}
/* quem depende (direta ou indiretamente) do item `token` e ainda não foi enviado */
function dependentesDe(fila, token){
  var out = [], vistos = {}; vistos[token] = true;
  var mudou = true;
  while (mudou) { mudou = false;
    fila.forEach(function(i){ if (vistos[i.token] || i.estado === 'enviado') return;
      if (refsDe(i).some(function(r){ return vistos[r]; })) { vistos[i.token] = true; out.push(i); mudou = true; } }); }
  return out;
}

  if (!navigator.onLine) { toast('Sem rede agora. Está tudo guardado no aparelho — envie quando o sinal voltar.'); return; }
  var pacote = { volta: location.origin + location.pathname + voltaDaFicha(), org: org.id, orgApp: org.orgApp || '', fuso: (db.cadastros && db.cadastros[org.id] && db.cadastros[org.id].fuso) || FUSO_PADRAO,
                 fila: pend.map(function(i){ return { token:i.token, tipo:i.tipo, quando:i.quando, payload:i.payload }; }) };
  location.href = juntaParam(org.offline, 'modo=sincronizar') + '#f=' + b64url(JSON.stringify(pacote));
}

/* LS · «igual com e sem rede» (D22 = S, 19/10): os 3 gestos da Básica (Receber, Abrir, Fechar) chamam isto DEPOIS de guardar na fila e conferir a leitura de volta.

    h += telaGeral(db, chkOff) + '<p class="aviso" id="nota-conta">Entre com uma conta Google (Gmail serve), a mesma que a cooperativa cadastrou no app.</p>';

  }
  if (!basica) h += chkOff;
  var org = orgAtual(), cad = db.cadastros && db.cadastros[org.id];
  var fila = (db.fila || []).filter(function(i){ return i.org === org.id; });
  var pend = fila.filter(function(i){ return i.estado === 'guardado'; });
  var lista = orgsOffline();
  if (!cad) {

         '<select class="txt" id="sel-org">' + lista.map(function(o){ return '<option value="' + esc(o.id) + '"' + (o.id === org.id ? ' selected' : '') + '>' + esc(o.nome) + '</option>'; }).join('') + '</select>' :
         '<div><b>' + esc(org.nome) + '</b></div>');
    h += '<div class="faixa" style="margin-top:12px"><span class="pill ' + (navigator.onLine ? 'on' : 'off') + '" id="pill-rede">' + (navigator.onLine ? 'com rede' : 'sem rede') + '</span>' +
         '<span class="pill">cadastros: ainda não</span></div>';
    h += '<p class="aviso" style="margin:0 0 12px">Para lançar sem rede, o aparelho precisa guardar uma vez as comunidades, famílias e produtos desta organização. Faça isso agora, com sinal.</p>' +
         '<button class="grande" id="btn-preparar">Preparar o modo offline</button>';
    app.innerHTML = textoVisivel_(h); ligarInicio(); return;
  }
  h += telaInicioBasica(db, org, cad, pend, fila, lista);
  h += chkOff.replace('class="chave"', 'class="chave" style="margin-top:16px"');
  app.innerHTML = textoVisivel_(h); ligarInicio();
  agendarAuto();

/* ══ OFF5 · INÍCIO DA BÁSICA ═══════════════════════════════════════════════════════════════════
   Os mesmos três blocos do Início do app, menos Alertas (calculados no servidor): «No galpão agora» (régua por etapa, com o filtro de
   cadeia), «O que fazer agora» (Receber · Abrir · Fechar, nesta ordem) e a faixa dos guardados. Os números somam o RETRATO do aparelho
   + a PROJEÇÃO da fila guardada (`projecao`) — o mesmo que o Abrir e o Fechar mostram. */
var FILTRO = '';                      /* a cadeia escolhida nos chips ('' = Todas) · vale no Início e no Estoque por etapa */
/* (sugestão Claude · validar) o estado de cada etapa em palavra de chão de galpão; etapa fora desta lista cai em «Saiu da <etapa>» */
var ESTADO_ETAPA = { REC:'Recebido', SEC:'Seco', QUE:'Quebrado', ARM:'Armazenado' };
function ddmm(cod){ var d = codData(cod); return d === '00000000' ? '' : d.slice(6, 8) + '/' + d.slice(4, 6); }
function horaTxt(iso, fuso){ try { return new Date(iso).toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit', timeZone: fuso || FUSO_PADRAO }); } catch(e){ return ''; } }
function minusc1(t){ t = String(t || ''); return t.charAt(0).toLowerCase() + t.slice(1); }
function acaoDaEtapa(e){ return e.id === 'ARM' ? 'Armazenar' : 'Abrir ' + e.nome; }
function esperandoDa(e){ return e.id === 'ARM' ? 'esperando armazenar' : 'esperando ' + minusc1(e.nome); }
function etapasOrdenadas(cad){ return (cad.etapas || []).slice().sort(function(a, b){ return ordDe(cad, a.id) - ordDe(cad, b.id); }); }
function cadeiasDe(cad, proj){
  var vistos = {}, out = [];
  (cad.materias || []).forEach(function(m){ var c = m[1] || m[0]; if (c && !vistos[c]) { vistos[c] = 1; out.push(c); } });
  proj.lista.forEach(function(k){ var c = proj.lotes[k].cadeia; if (c && !vistos[c]) { vistos[c] = 1; out.push(c); } });
  return out;
}
function chipsHtml(cad, proj){
  var cs = cadeiasDe(cad, proj);
  if (FILTRO && cs.indexOf(FILTRO) < 0) FILTRO = '';
  return '<div class="chips" id="chips-cadeia">' + ['' ].concat(cs).map(function(c){
    return '<button class="chip' + (c === FILTRO ? ' on' : '') + '" data-cadeia="' + esc(c) + '">' + (c ? esc(c) : 'Todas') + '</button>'; }).join('') + '</div>';
}
/* o que cada etapa que se ABRE aceita, uma vez só: {etapaId: {chaveDoLote: true}} — a MESMA `lotesElegiveis` do Abrir */
function elegiveisPorEtapa(cad, proj){
  var m = {}; (cad.etapas || []).forEach(function(e){ m[e.id] = {}; lotesElegiveis(cad, proj, e.id).forEach(function(l){ m[e.id][l.chave] = true; }); });
  return m;
}
function proximoDoLote(cad, eleg, l){
  var ets = etapasOrdenadas(cad);
  for (var i = 0; i < ets.length; i++) if (eleg[ets[i].id] && eleg[ets[i].id][l.chave]) return ets[i];
  return null;
}
/* Abrir: os lotes que entram em ALGUMA etapa que se abre (o mesmo critério da lista do Abrir) · Fechar: as operações da lista do Fechar */
function contagemAbrir(cad, proj){
  var eleg = elegiveisPorEtapa(cad, proj), n = 0;
  proj.lista.forEach(function(k){ if ((cad.etapas || []).some(function(e){ return eleg[e.id][k]; })) n++; });
  return n;
}
function opsDoFechar(proj){ return proj.alista.map(function(k){ return proj.abertas[k]; }); }
function resumoDoGalpao(cad, proj, filtro){
  var lotes = proj.lista.map(function(k){ return proj.lotes[k]; }).filter(function(l){ return l.saldo > 0.001 && (!filtro || l.cadeia === filtro); });
  var ops = opsDoFechar(proj).filter(function(o){ return !filtro || o.cadeia === filtro; });
  var eleg = elegiveisPorEtapa(cad, proj), ids = {}, rows = [];
  ids.REC = 1; (cad.etapas || []).forEach(function(e){ ids[e.id] = 1; }); lotes.forEach(function(l){ if (!l.sub) ids[l.etapa] = 1; });
  Object.keys(ids).sort(function(a, b){ return ordDe(cad, a) - ordDe(cad, b); }).forEach(function(id){
    var et = etapaDeCad(cad, id), nome = nomeDaEtapa(cad, id);
    var daEtapa = ops.filter(function(o){ return o.etapa === id; });
    if (daEtapa.length) rows.push({ chave:'op:' + id, tipo:'op', nome:'Na ' + minusc1(nome), sub: daEtapa.length + (daEtapa.length === 1 ? ' operação aberta' : ' operações abertas'), n: daEtapa.length,
                                    kg: arred2(daEtapa.reduce(function(a, o){ return a + (Number(o.kg) || 0); }, 0)) });
    var ls = lotes.filter(function(l){ return !l.sub && l.etapa === id; });
    if (ls.length) {
      var prox = null; ls.some(function(l){ var p = proximoDoLote(cad, eleg, l); if (p && (!prox || ordDe(cad, p.id) < ordDe(cad, prox.id))) prox = p; return false; });
      rows.push({ chave:'lote:' + id, tipo:'lote', nome: ESTADO_ETAPA[id] || ('Saiu da ' + minusc1(nome)),
                  sub: (prox ? esperandoDa(prox) : (id === 'ARM' || ehMov(et) ? 'em estoque' : 'sem próximo passo')) + ' · ' + ls.length,
                  n: ls.length, kg: arred2(ls.reduce(function(a, l){ return a + l.saldo; }, 0)) });
    }
  });
  var subs = lotes.filter(function(l){ return l.sub; });
  if (subs.length) {
    var nomes = []; subs.forEach(function(l){ if (nomes.indexOf(l.produto) < 0) nomes.push(l.produto); });
    rows.push({ chave:'sub', tipo:'sub', nome:'Subprodutos', sub: nomes.slice(0, 2).join(' e ') + (nomes.length > 2 ? ' e mais ' + (nomes.length - 2) : '') + ' · ' + subs.length,
                n: subs.length, kg: arred2(subs.reduce(function(a, l){ return a + l.saldo; }, 0)) });
  }
  return rows;
}
function reguaHtml(rows){
  if (!rows.length) return '<p class="aviso" id="regua-vazia" style="margin:0">Nada no galpão' + (FILTRO ? ' desta cadeia' : '') + ' segundo o retrato deste aparelho.</p>';
  var max = Math.max.apply(null, rows.map(function(r){ return r.kg; })) || 1;
  return '<div class="regua" id="regua">' + rows.map(function(r){
    return '<div class="rl" data-linha="' + esc(r.chave) + '" data-kg="' + r.kg + '" data-n="' + r.n + '"><span class="et">' + esc(r.nome) + '<small>' + esc(r.sub) + '</small></span>' +
           '<span class="bar"><i class="' + (r.tipo === 'op' ? 'proc' : r.tipo === 'sub' ? 'sub' : '') + '" style="width:' + Math.max(2, r.kg / max * 100).toFixed(1) + '%"></i></span><span class="kg">' + kgTxt(Math.round(r.kg)) + ' kg</span></div>';
  }).join('') + '</div>';
}
function telaInicioBasica(db, org, cad, pend, fila, lista){
  var proj = projecao(db, org), fuso = fusoDe(cad), h = '';
  var ret = quandoTxt(cad.geradoEm, fuso), hora = horaTxt(cad.geradoEm, fuso);
  /* B7 · o botão do TOPO, sempre visível: um toque = Enviar + Atualizar cadastros numa ida só ao /exec (a página de envio já manda os cadastros depois dos itens) */
  h += '<button class="sync' + (pend.length ? ' pend' : '') + '" id="btn-enviar">Sincronizar · ' + (pend.length ? pend.length + (pend.length === 1 ? ' guardado' : ' guardados') + ' · ' : '') + 'retrato de ' + esc(hora) + '</button>';
  h += '<div id="slot-auto"></div>';
  if (lista.length > 1) h += '<select class="txt" id="sel-org" style="margin:0 0 10px">' + lista.map(function(o){ return '<option value="' + esc(o.id) + '"' + (o.id === org.id ? ' selected' : '') + '>' + esc(o.nome) + '</option>'; }).join('') + '</select>';
  h += '<div class="faixa"><span class="pill ' + (navigator.onLine ? 'on' : 'off') + '" id="pill-rede">' + (navigator.onLine ? 'com rede' : 'sem rede') + '</span>' +
       '<span class="pill" id="pill-retrato">retrato de ' + esc(ret) + '</span>' +
       ((db.cadVelho || {})[org.id] ? '<span class="pill off" id="pill-velho">cadastros desatualizados · toque em «Sincronizar»</span>' : '') + '</div>';
  h += chipsHtml(cad, proj);
  h += '<div class="sec"><p class="lbl">No galpão agora</p>' + reguaHtml(resumoDoGalpao(cad, proj, FILTRO)) + '</div>';
  var nAbrir = contagemAbrir(cad, proj), ops = opsDoFechar(proj), nFechar = ops.length, maisVelha = null;
  ops.forEach(function(o){ if (o.codigo && (!maisVelha || codData(o.codigo) < codData(maisVelha.codigo))) maisVelha = o; });
  h += '<div class="sec"><p class="lbl">O que fazer agora</p><div class="ac3" id="acoes">' +
       '<button class="ac" id="btn-receber"><span class="n">&nbsp;</span><span class="v">Receber</span><span class="s">entrega nova</span></button>' +
       '<button class="ac' + (nAbrir ? ' prim' : '') + '" id="btn-abrir"><span class="n" id="n-abrir">' + nAbrir + '</span><span class="v">Abrir</span><span class="s">' + (nAbrir === 1 ? 'lote esperando' : 'lotes esperando') + '</span></button>' +
       '<button class="ac' + (nFechar ? ' prim' : '') + '" id="btn-fechar"><span class="n" id="n-fechar">' + nFechar + '</span><span class="v">Fechar</span><span class="s">' +
         (nFechar ? (maisVelha ? esc(nomeDaEtapa(cad, maisVelha.etapa)) + ' · desde ' + esc(ddmm(maisVelha.codigo)) : (nFechar === 1 ? 'operação aberta' : 'operações abertas')) : 'nenhuma aberta') + '</span></button></div>' +
       '<div class="botoes"><button class="bt" id="btn-estoque">Estoque por etapa</button><button class="bt lar" id="btn-lerqr">Ler QR</button></div></div>';
  h += '<p class="lbl">Lançamentos deste aparelho</p>';
  h += fila.length ? '<ul class="fila">' + fila.slice().reverse().map(function(i){ return linhaFila(i, fila, fuso); }).join('') + '</ul>'
                   : '<p class="aviso" style="margin:0 0 12px">Nada lançado neste aparelho ainda.</p>';
  h += '<p class="aviso">Quem assina o envio é a conta Google aberta no celular na hora de enviar. Enviar de novo é seguro: o que já entrou não entra duas vezes. O botão «Sincronizar» no topo envia o que está guardado e atualiza os cadastros numa ida só.</p>';
  return h;
}

  var bq = document.getElementById('btn-lerqr'); if (bq) bq.onclick = function(){ abrirLeitor(); };

/* ══ OFF5 · ESTOQUE POR ETAPA (tela 2 do mockup) ═══════════════════════════════════════════════
   Os lotes do retrato + os da fila guardada, em grupos «<estado> · esperando <próxima etapa>», com o total de kg no cabeçalho do grupo e,
   em cada cartão, o próximo passo como botão — o que leva ao Abrir com a etapa escolhida e o lote já na operação. Tocar no cartão abre a ficha
   (lote guardado no aparelho ainda não tem código: sem ficha). SEM o rótulo «parado»: ele é alerta calculado no servidor (média da etapa). */
function gruposDoEstoque(cad, proj, filtro){
  var eleg = elegiveisPorEtapa(cad, proj), mapa = {}, ordem = [];
  proj.lista.forEach(function(k){
    var l = proj.lotes[k]; if (!(l.saldo > 0.001) || (filtro && l.cadeia !== filtro)) return;
    var g = l.etapa; if (!mapa[g]) { mapa[g] = { etapa:g, lotes:[], kg:0 }; ordem.push(g); }
    mapa[g].lotes.push(l); mapa[g].kg += l.saldo;
  });
  ordem.sort(function(a, b){ return ordDe(cad, a) - ordDe(cad, b); });
  return ordem.map(function(id){
    var g = mapa[id], et = etapaDeCad(cad, id), prox = null;
    g.lotes.forEach(function(l){ l.proximo = proximoDoLote(cad, eleg, l); if (l.proximo && (!prox || ordDe(cad, l.proximo.id) < ordDe(cad, prox.id))) prox = l.proximo; });
    g.titulo = (ESTADO_ETAPA[id] || ('Saiu da ' + minusc1(nomeDaEtapa(cad, id)))) + ' · ' + (prox ? esperandoDa(prox) : (id === 'ARM' || ehMov(et) ? 'em estoque' : 'sem próximo passo'));
    g.kg = arred2(g.kg);
    /* mais antigo primeiro (PEPS, como o Abrir); o que é só do aparelho vai por último */
    g.lotes.sort(function(a, b){ return (a.codigo ? codData(a.codigo) : '99999999').localeCompare(b.codigo ? codData(b.codigo) : '99999999'); });
    return g;
  });
}
function telaEstoque(db){
  var org = orgAtual(), cad = db.cadastros[org.id], proj = projecao(db, org);
  var h = '<div class="topo"><button class="link" id="btn-voltar">‹ voltar</button></div><h2>Estoque por etapa</h2><p class="nota-linha" style="margin:-6px 0 0">toque no lote para ver a ficha</p>';
  h += chipsHtml(cad, proj);
  var gs = gruposDoEstoque(cad, proj, FILTRO);
  if (!gs.length) return h + '<p class="aviso" id="estoque-vazio">Nenhum lote com saldo' + (FILTRO ? ' nesta cadeia' : '') + ' no retrato deste aparelho.</p>';
  h += '<div id="estoque">' + gs.map(function(g){
    return '<div class="grupo" data-grupo="' + esc(g.etapa) + '" data-kg="' + g.kg + '"><h3><b>' + esc(g.titulo) + '</b><span>' + kgTxt(Math.round(g.kg)) + ' kg</span></h3>' + g.lotes.map(function(l){
      var venda = acabaVendaDe(cad, l);
      return '<' + (l.codigo ? 'div role="button" tabindex="0" data-ficha="' + esc(l.codigo) + '"' : 'div') + ' class="lt' + (l.sub ? ' sub' : '') + (l.local ? ' local' : '') + '" data-lote="' + esc(l.chave) + '">' +
        '<b>' + esc(l.produto) + '</b><span class="kg">' + kgTxt(l.saldo) + ' kg</span>' +
        '<small' + (l.local ? ' class="local"' : '') + '>' + esc(l.codigo ? l.codigo + ' · ' + (l.sub ? 'subproduto' : diasTxt(l.dias)) : LOCAL_TXT) + (venda ? ' · acaba na venda ' + esc(venda) : '') + '</small>' +
        (l.proximo && !venda ? '<button class="mini" data-abrir="' + esc(l.chave) + '" data-etapa-abrir="' + esc(l.proximo.id) + '">' + esc(acaoDaEtapa(l.proximo)) + '</button>' : '<span></span>') + '</div>';
    }).join('') + '</div>';
  }).join('') + '</div>';
  return h;
}
function ligarEstoque(){
  var org = orgAtual(), db = ler(), cad = db.cadastros[org.id];
  document.getElementById('btn-voltar').onclick = function(){ TELA = { nome:'inicio' }; render(); };
  document.querySelectorAll('[data-cadeia]').forEach(function(b){ b.onclick = function(){ FILTRO = b.dataset.cadeia; render(); }; });
  document.querySelectorAll('[data-ficha]').forEach(function(c){ c.onclick = function(){ abrirFicha(org.id, c.dataset.ficha, 'estoque'); }; });
  document.querySelectorAll('[data-abrir]').forEach(function(b){ b.onclick = function(ev){
    ev.stopPropagation();
    var proj = projecao(ler(), org), f = { etapa: b.dataset.etapaAbrir, lotes:{}, obs:'', pre: b.dataset.abrir };
    puxarLotePre(f, cad, proj); TELA = { nome:'abrir', form: f }; render(); }; });
}

/* ══ OFF5 · ENVIO AUTOMÁTICO QUANDO A REDE VOLTA (B6 · D5) ═════════════════════════════════════
   A lançadora só fala com o Google NAVEGANDO ao /exec (fetch com login não passa; Background Sync não existe no iPhone) — então «sozinho» é em
   PRIMEIRO PLANO, nunca escondido. Com rede, na tela inicial, e (há lançamento guardado OU os cadastros têm mais de 6 h): a faixa «Enviando em 5 s ·
   Cancelar» e a página vai ao envio. Nunca no meio de um formulário; uma tentativa por volta da rede (falhou → fica o botão); «Cancelar» vale até a
   próxima volta da rede. A marca da tentativa mora no sessionStorage da aba: a volta do /exec (que recarrega a página) não dispara de novo. */
var AUTO_SEG = 5, CADASTROS_VELHOS_H = 6, AUTO = { timer:null, falta:0, motivo:'' };
function sess(k, v){ try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch(e){} return null; }
function autoDesligado(){ try { return localStorage.getItem('estoque_auto_off') === '1'; } catch(e){ return false; } }
/* o que o automático enviaria agora: 'fila' | 'cadastros' | '' (nada) */
function autoPrecisa(){
  if (autoDesligado() || sess('estoque_auto') || !navigator.onLine || TELA.nome !== 'inicio') return '';
  var db = ler(); if (!db.modoOffline) return '';
  var org = orgAtual(), cad = org && db.cadastros && db.cadastros[org.id]; if (!cad || !org.offline) return '';
  if ((db.fila || []).some(function(i){ return i.org === org.id && i.estado === 'guardado'; })) return 'fila';
  var idade = Date.now() - Date.parse(cad.geradoEm);
  return (idade <= CADASTROS_VELHOS_H * 3600e3) ? '' : 'cadastros';            /* data ilegível = velho */
}
function pararAuto(limpaFaixa){
  clearInterval(AUTO.timer); AUTO.timer = null; AUTO.falta = 0; AUTO.motivo = '';
  if (limpaFaixa) { var s0 = document.getElementById('slot-auto'); if (s0) s0.innerHTML = ''; }
}
function faixaAutoHtml(){
  return '<div class="faixa-auto" id="faixa-auto" role="status"><span>' + (AUTO.motivo === 'cadastros' ? 'Atualizando os cadastros em ' : 'Enviando em ') + '<b id="auto-seg">' + AUTO.falta + '</b> s</span><button id="btn-auto-cancelar">Cancelar</button></div>';
}
function agendarAuto(){
  var motivo = autoPrecisa();
  if (!motivo) { pararAuto(true); return; }
  var slot = document.getElementById('slot-auto'); if (!slot) return;
  if (!AUTO.timer) { AUTO.falta = AUTO_SEG; AUTO.motivo = motivo;
    AUTO.timer = setInterval(function(){
      AUTO.falta--;
      var m = autoPrecisa();                                   /* reconfere a CADA segundo: saiu da tela inicial, perdeu a rede ou já não há o que enviar → desiste calada */
      if (!m) { pararAuto(true); return; }
      if (AUTO.falta > 0) { var e = document.getElementById('auto-seg'); if (e) e.textContent = AUTO.falta; return; }
      pararAuto(true); sess('estoque_auto', 'tentou');           /* a marca vai ANTES da navegação: se o envio falhar, a volta não tenta de novo */
      enviar(m === 'cadastros');
    }, 1000); }
  AUTO.motivo = motivo; slot.innerHTML = textoVisivel_(faixaAutoHtml());

/* ══ OFF4 · FICHA DO LOTE, LINK-QR E «LER QR» ══════════════════════════════════════════════════

  var ret = quandoTxt(cad.geradoEm, fusoDe(cad));
  h += '<div class="faixa"><span class="pill laranja">' + esc(org.nome) + '</span><span class="pill ' + (rede ? 'on' : 'off') + '">' + (rede ? 'com rede' : 'sem rede') + '</span><span class="pill" id="ficha-retrato">retrato de ' + esc(ret) + '</span></div>';

  var P = projecao(db, org), pl = P.lotes[cod], aberta = P.abertas[cod], proc = /processamento/i.test(fi[2]);
  var saldoRetrato = fi[5], saldoMostrado = pl ? pl.saldo : saldoRetrato, usado = kgUsadoGuardado(db, org, cod);

  var d = diasDesde(fi[3], fusoDe(cad));

  h += '</div>';
  h += balancoDoLoteHtml(fi, cod, proc, saldoMostrado, saldoRetrato, usado);

  if (pl && pl.saldo > 0.001) {

}
/* OFF5 · B3 · O BALANÇO DE MASSA DO LOTE. Uma barra «o que este lote virou» — usado em operações seguintes · vendido · disponível — sobre o kg de origem e,
   quando o lote nasceu de uma operação que TRANSFORMA, a linha «Entrou X kg → saiu Y kg (rendimento Z %) · quebra Q kg». Fonte: as colunas da CALC_LOTES que o
   servidor leva na ficha ([9] consumido · [10] vendido · [11] quebra da operação · [12] rendimento da operação). Ficha sem elas (retrato antigo): sem balanço, e a tela diz. */
function balancoDoLoteHtml(fi, cod, proc, saldoMostrado, saldoRetrato, usadoGuardado){
  var base = Number(fi[4]) || 0, cons = fi[9], vend = fi[10], qop = fi[11], rend = fi[12];
  if (proc || !(base > 0)) return '';
  if (cons == null || vend == null) return '<p class="aviso" id="ficha-sem-balanco">Os cadastros deste aparelho não trazem o balanço deste lote. Atualize os cadastros (com sinal).</p>';
  var segs = [], ajuste = arred2(base - cons - vend - saldoRetrato);
  if (cons > 0.004) segs.push({ id:'usado', nome:'Usado em operações seguintes', kg:cons, cor:COR_BM.usado });
  if (usadoGuardado > 0.004) segs.push({ id:'guardado', nome:'Usado em lançamentos guardados neste aparelho', kg:usadoGuardado, cor:COR_BM.guardado });
  if (vend > 0.004) segs.push({ id:'vendido', nome:'Vendido', kg:vend, cor:COR_BM.vendido });
  if (ajuste > 0.5) segs.push({ id:'ajuste', nome:'Ajuste de estoque', kg:ajuste, cor:COR_BM.ajuste });
  if (saldoMostrado > 0.004) segs.push({ id:'disp', nome:'Disponível', kg:saldoMostrado, cor:COR_BM.disp, tinta:'#1A1A1A' });
  var total = segs.reduce(function(a, g){ return a + g.kg; }, 0), ref = Math.max(total, base) || 1;
  var h = '<div class="bm" id="ficha-balanco"><div class="bm-h">Balanço de Massa</div><div class="bm-t">O que este lote virou</div>' +
          '<div class="bm-cab"><b>' + kgTxt(base) + ' kg</b><span>de origem</span></div>' + barraBM(segs, ref, 'virou') + legendaBM(segs, base);
  var sub = /^1SUB/i.test(String(cod || '')) || /subproduto/i.test(fi[2]);          /* a quebra/rendimento da operação é do PRINCIPAL; o subproduto não repete a linha */
  if (!sub && rend != null && qop != null && rend > 0 && rend <= 1 && (qop > 0.5 || rend < 0.9995)) {
    var entrou = arred2(base / rend);
    h += '<p class="bm-linha" id="ficha-operacao">Entrou <b>' + kgTxt(entrou) + ' kg</b> → saiu <b>' + kgTxt(base) + ' kg</b> (rendimento ' + pctTxt(rend) + ') · quebra <b>' + kgTxt(qop) + ' kg</b></p>' +
         barraBM([{ id:'saiu', nome:'Saiu (este lote)', kg:base, cor:COR_BM.principal, tinta:'#1A1A1A' }, { id:'quebra', nome:'Quebra', kg:qop, quebra:true }], Math.max(entrou, base + qop), 'operacao');
  }
  return h + '</div>';
}

/* ── «Ler QR»: a câmera traseira, um quadro a cada ~250 ms ─────────────────────────────────── */
var LEITOR = { ativo:false, stream:null, timer:null, det:null, ocupado:false };
function pararCamera(){
  LEITOR.ativo = false; clearTimeout(LEITOR.timer); LEITOR.timer = null; LEITOR.ocupado = false;
  if (LEITOR.stream) { LEITOR.stream.getTracks().forEach(function(t){ try { t.stop(); } catch(e){} }); LEITOR.stream = null; }
}
function carregarScript(src){
  return new Promise(function(ok, falha){
    var s = document.createElement('script'); s.src = src; s.onload = function(){ ok(); }; s.onerror = function(){ falha(new Error('não carregou ' + src)); };
    document.head.appendChild(s);
  });
}
/* o leitor do aparelho: nativo se ele sabe QR; senão o de vendor/, que só é baixado/lido AGORA (a página inicial não engorda) */
function leitorDeQR(){
  var polyfill = function(){
    var pronto = window.LeitorQR ? Promise.resolve() : carregarScript('vendor/zxing-reader.iife.js').then(function(){ return carregarScript('leitor-qr.js'); });
    return pronto.then(function(){ return new window.LeitorQR(); });
  };
  if (window.BarcodeDetector && BarcodeDetector.getSupportedFormats) {
    return BarcodeDetector.getSupportedFormats().then(function(fs){ return (fs || []).indexOf('qr_code') >= 0 ? new BarcodeDetector({ formats:['qr_code'] }) : polyfill(); }, polyfill);
  }
  return polyfill();
}
function erroDaCamera(err){
  var n = (err && err.name) || '';
  if (/NotAllowed|PermissionDenied|Security/i.test(n)) return 'A câmera está bloqueada para este site. Libere a câmera nas configurações do navegador (ou do aparelho) e tente de novo — ou digite o código do lote abaixo.';
  if (/NotFound|DevicesNotFound|Overconstrained/i.test(n)) return 'Este aparelho não tem câmera disponível. Digite o código do lote abaixo.';
  if (/NotReadable|Abort|TrackStart/i.test(n)) return 'A câmera está em uso por outro aplicativo. Feche-o e tente de novo — ou digite o código do lote abaixo.';
  return 'Não consegui abrir a câmera' + (err && err.message ? ' (' + err.message + ')' : '') + '. Digite o código do lote abaixo.';
}
function telaLeitor(){
  return '<div class="topo"><button class="link" id="btn-cancelar">‹ cancelar</button></div><h2>Ler QR do lote</h2>' +
    '<div class="visor"><video id="video" playsinline muted autoplay></video></div>' +
    '<p class="aviso" id="leitor-msg" role="status">Abrindo a câmera…</p>' +
    '<p class="lbl">Ou digite o código do lote</p><input class="txt" id="cod-manual" placeholder="REC-20261001-002" autocapitalize="characters" autocomplete="off">' +
    '<div style="margin-top:10px"><button class="grande sec" id="btn-cod">Abrir a ficha</button></div>';
}
function msgLeitor(t, erro){ var e = document.getElementById('leitor-msg'); if (e) { e.textContent = t; e.className = 'aviso' + (erro ? ' erro-txt' : ''); } }
function abrirLeitor(){ TELA = { nome:'leitor' }; render(); }
/* um texto lido (câmera, imagem ou digitado) → a ficha; o que não for lote diz isso e continua lendo */
function abrirLeitura(txt){
  var p = interpretarQR(txt);
  if (!p) return false;
  pararCamera(); abrirFicha(p.org, p.lote, 'leitor'); return true;
}
function ligarLeitor(){
  var voltar = function(){ pararCamera(); TELA = { nome:'inicio' }; render(); };
  document.getElementById('btn-cancelar').onclick = voltar;
  document.getElementById('btn-cod').onclick = function(){
    var t = document.getElementById('cod-manual').value;
    if (!abrirLeitura(t)) msgLeitor('Isso não parece um código de lote (como REC-20261001-002).', true);
  };
  iniciarLeitor();
}
function iniciarLeitor(){
  LEITOR.ativo = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msgLeitor('Este navegador não deixa abrir a câmera aqui (ela só funciona em página segura). Digite o código do lote abaixo.', true); return; }
  navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' }, audio:false }).then(function(stream){
    if (!LEITOR.ativo) { stream.getTracks().forEach(function(t){ t.stop(); }); return; }      /* cancelou enquanto o aparelho perguntava a permissão */
    LEITOR.stream = stream;
    var v = document.getElementById('video'); if (!v) { pararCamera(); return; }
    v.srcObject = stream; if (v.play) v.play().catch(function(){});
    msgLeitor('Preparando o leitor…');
    return leitorDeQR().then(function(det){ LEITOR.det = det; msgLeitor('Aponte a câmera para o QR do lote.'); lacoLeitor(); },
      function(){ msgLeitor('Não consegui carregar o leitor de QR neste aparelho. Digite o código do lote abaixo.', true); });
  }, function(err){ if (LEITOR.ativo) msgLeitor(erroDaCamera(err), true); });
}
function lacoLeitor(){
  if (!LEITOR.ativo) return;
  LEITOR.timer = setTimeout(function(){
    var v = document.getElementById('video');
    if (!v || !LEITOR.ativo) return;
    if (v.readyState < 2 || LEITOR.ocupado) return lacoLeitor();
    LEITOR.ocupado = true;
    LEITOR.det.detect(v).then(function(rs){
      LEITOR.ocupado = false; if (!LEITOR.ativo) return;
      var txt = rs && rs[0] && rs[0].rawValue;
      if (!txt) return lacoLeitor();
      if (!abrirLeitura(txt)) { msgLeitor('Li «' + String(txt).slice(0, 40) + '», mas isso não é o QR de um lote. Aponte para o QR do saco ou do palete.', true); lacoLeitor(); }
    }, function(){ LEITOR.ocupado = false; lacoLeitor(); });
  }, 250);
}

/* ── RECEBER simplificado: comunidade → produto → famílias e peso ─────────── */
function semAcento(t){ return String(t == null ? '' : t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
/* as famílias da comunidade escolhida — pelo ID ou pelo NOME (o cadastro antigo guarda o nome: D-167) — em ordem alfabética */
function familiasDaComunidade(cad, idCom, com){
  return (cad.familias || []).filter(function(fa){ return fa[2] === idCom || (com && fa[2] === com[1]); })
    .sort(function(a, b){ return String(a[1]).localeCompare(String(b[1]), 'pt-BR'); });
}
function telaReceber(db){
  var org = orgAtual(), cad = db.cadastros[org.id], f = TELA.form;

  var com = cad.comunidades.find(function(c){ return c[0] === f.comunidade; });
  if (!f.comunidade) {
    return h + '<p class="lbl">De qual comunidade?</p><div class="grade">' + cad.comunidades.map(function(c){
      return '<button class="opc" data-com="' + esc(c[0]) + '">' + esc(c[1]) + '</button>'; }).join('') + '</div>';
  }
  h += '<div class="faixa"><button class="pill laranja" id="troca-com">' + esc(com ? com[1] : f.comunidade) + ' ✕</button>' +
       (f.produto ? '<button class="pill laranja" id="troca-prod">' + esc(f.produto) + ' ✕</button>' : '') + '</div>';
  if (!f.produto) {
    return h + '<p class="lbl">Qual produto está entrando?</p><div class="grade">' + cad.materias.map(function(m){
      return '<button class="opc" data-prod="' + esc(m[0]) + '">' + esc(m[0]) + '</button>'; }).join('') + '</div>';
  }
  /* OFF3 · a LISTA das famílias da comunidade (com caixa para marcar); a busca é só FILTRO, sem acento e sem maiúscula */
  var daCom = familiasDaComunidade(cad, f.comunidade, com);
  var ja = f.itens.map(function(i){ return i.familia; });
  var q = (f.busca || '').trim(), qn = semAcento(q);
  var restantes = daCom.filter(function(fa){ return ja.indexOf(fa[0]) < 0; });
  var lista = restantes.filter(function(fa){ return !qn || semAcento(fa[1]).indexOf(qn) >= 0; });
  h += '<p class="lbl">Famílias e peso' + (f.itens.length ? ' · ' + f.itens.length + ' marcada(s)' : '') + '</p>';
  h += f.itens.map(function(it, k){
    return '<div class="linha"><div class="nome">' + esc(it.nome) + (it.nova ? '<small>família nova · o gestor completa o cadastro</small>' : '') + '</div>' +
           '<input inputmode="decimal" data-kg="' + k + '" value="' + esc(it.kg) + '" placeholder="kg"><button class="x" data-tira="' + k + '" aria-label="tirar">×</button></div>';
  }).join('');
  h += '<p class="lbl">Marcar famílias de ' + esc(com ? com[1] : '') + ' · ' + lista.length + (q ? ' de ' + restantes.length : '') + '</p>' +
       '<input class="txt" id="busca" type="search" placeholder="filtrar pelo nome (sem acento)" value="' + esc(f.busca || '') + '" autocomplete="off">' +
       '<div class="lista-fam" id="lista-fam" role="group" aria-label="Famílias da comunidade">' +
       (lista.length ? lista.map(function(fa){ return '<label class="fam"><input type="checkbox" data-fam="' + esc(fa[0]) + '"><span>' + esc(fa[1]) + '</span></label>'; }).join('')
         : '<div class="vazio-fam">' + (q ? 'Nenhuma família com «' + esc(q) + '» nesta comunidade.' : (daCom.length ? 'Todas as famílias da comunidade já estão marcadas.' : 'Nenhuma família cadastrada nesta comunidade.')) + '</div>') + '</div>';
  h += '<div class="sug">' + (q && !daCom.some(function(fa){ return semAcento(fa[1]) === qn; }) && !f.itens.some(function(i){ return semAcento(i.nome) === qn; })
       ? '<button class="nova" id="fam-nova">+ família nova: «' + esc(q) + '»</button>' : '') + '</div>';
  var total = f.itens.reduce(function(a,i){ return a + numDe(i.kg); }, 0);
  var pronto = f.itens.length > 0 && f.itens.every(function(i){ return numDe(i.kg) > 0; });
  h += '<div class="total">Total que entra: <b id="total">' + kgTxt(total) + ' kg</b></div>';
  h += '<p class="lbl">Observação (opcional)</p><input class="txt" id="obs" value="' + esc(f.obs || '') + '" placeholder="algo fora do normal nesta entrega">';
  var ops = cad.operadores || [], eu = cad.eu && cad.eu.operador;

    return '<option value="' + esc(o[0]) + '"' + (o[0] === op ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';

function ligarReceber(){
  var f = TELA.form, org = orgAtual();
  document.getElementById('btn-voltar').onclick = function(){ TELA = { nome:'inicio' }; render(); };
  document.querySelectorAll('[data-com]').forEach(function(b){ b.onclick = function(){ f.comunidade = b.dataset.com; f.itens = []; render(); }; });
  document.querySelectorAll('[data-prod]').forEach(function(b){ b.onclick = function(){ f.produto = b.dataset.prod; render(); }; });
  var tc = document.getElementById('troca-com'); if (tc) tc.onclick = function(){ f.comunidade = ''; f.produto = ''; f.itens = []; render(); };
  var tp = document.getElementById('troca-prod'); if (tp) tp.onclick = function(){ f.produto = ''; render(); };
  var busca = document.getElementById('busca');
  if (busca) {
    busca.oninput = function(){ f.busca = busca.value; var pos = busca.selectionStart; render(); var b2 = document.getElementById('busca'); b2.focus(); b2.setSelectionRange(pos, pos); };
    if (f._focoBusca) { busca.focus(); f._focoBusca = false; }
  }
  var cad = ler().cadastros[org.id];
  document.querySelectorAll('[data-fam]').forEach(function(b){ b.onchange = function(){
    if (!b.checked) return;
    var fa = cad.familias.find(function(x){ return x[0] === b.dataset.fam; });
    var lf = document.getElementById('lista-fam'), rolou = lf ? lf.scrollTop : 0;      /* marcar não leva a lista de volta ao topo */
    f.itens.push({ familia: fa[0], nome: fa[1], kg:'' }); render();
    var lf2 = document.getElementById('lista-fam'); if (lf2) lf2.scrollTop = rolou; }; });
  var fn = document.getElementById('fam-nova'); if (fn) fn.onclick = function(){
    var nome = f.busca.trim(); f.itens.push({ familia: 'NOVA:' + nome, nome: nome, kg:'', nova:true }); f.busca = ''; render(); };
  document.querySelectorAll('[data-kg]').forEach(function(inp){ inp.oninput = function(){
    f.itens[+inp.dataset.kg].kg = inp.value;
    document.getElementById('total').textContent = kgTxt(f.itens.reduce(function(a,i){ return a + numDe(i.kg); }, 0)) + ' kg';
    atualizarGuardar(); }; });
  document.querySelectorAll('[data-tira]').forEach(function(b){ b.onclick = function(){ f.itens.splice(+b.dataset.tira, 1); render(); }; });
  var obs = document.getElementById('obs'); if (obs) obs.oninput = function(){ f.obs = obs.value; };
  var sop = document.getElementById('sel-op'); if (sop) sop.onchange = function(){ mudar(function(db){ db.operador[org.id] = sop.value; }); atualizarGuardar(); };
  var bg = document.getElementById('btn-guardar'); if (bg) bg.onclick = guardar;
}
function atualizarGuardar(){
  var f = TELA.form, bg = document.getElementById('btn-guardar'), sop = document.getElementById('sel-op'); if (!bg) return;
  bg.disabled = !(f.itens.length && f.itens.every(function(i){ return numDe(i.kg) > 0; }) && sop && sop.value);
}

function guardar(){
  var f = TELA.form, org = orgAtual(), db = ler(), cad = db.cadastros[org.id];
  var op = document.getElementById('sel-op').value;
  var com = cad.comunidades.find(function(c){ return c[0] === f.comunidade; });
  var item = {
    token: novoToken(), tipo: 'receber', org: org.id, quando: new Date().toISOString(), estado: 'guardado',
    payload: { operador: op, comunidade: f.comunidade, comunidadeNome: com ? com[1] : '', produto: f.produto,
      itens: f.itens.map(function(i){ return { familia: i.familia, nome: i.nome, kg: numDe(i.kg), obs: (f.obs || '').trim() }; }) }
  };
  /* clique duplo: o mesmo conteúdo do último guardado não vira segundo lançamento (referência 08 §4.1) */
  var ultimo = (db.fila || []).filter(function(i){ return i.org === org.id && i.estado === 'guardado'; }).pop();
  if (ultimo && JSON.stringify(ultimo.payload) === JSON.stringify(item.payload) && Date.now() - Date.parse(ultimo.quando) < 60000) {
    toast('Esse lançamento já está guardado.'); TELA = { nome:'inicio' }; render(); return;
  }
  var ok = mudar(function(d){ d.fila.push(item); d.operador[org.id] = op; });
  var confere = ok && ler().fila.some(function(i){ return i.token === item.token; });   // lê de volta: guardar que não lança não é guardar que deu certo
  if (!confere) { toast('O aparelho NÃO guardou (sem espaço ou modo privado). Anote no papel.'); return; }
  TELA = { nome:'inicio' }; render();
  if (!enviarAgora_()) toast('Guardado no aparelho ✓ — ainda não está na planilha.');   /* LS · com rede o gesto já sobe; sem rede fica como sempre */
}

function copiarTexto(txt, msg){
  var ok = function(){ toast(msg || 'Copiado'); };
  function reserva(){
    var a = document.createElement('textarea'); a.value = txt; a.setAttribute('readonly', ''); a.style.position = 'fixed'; a.style.opacity = '0';
    document.body.appendChild(a); a.select();
    try { document.execCommand('copy'); ok(); } catch(e){ toast('Não deu para copiar: segure o texto e copie'); }
    document.body.removeChild(a);

}

function entrar(o){

  marcarRecebida(o, true);
  var db = ler();

  h += '<div class="lu-box lu-gap"><h3>Ferramentas</h3><p class="lu-mini"><a href="?sonda=1" id="lnk-sonda">Sonda da plataforma</a> · mostra se este endereço serve o modo sem rede &nbsp;|&nbsp; <a href="qr-teste.html" id="lnk-qr-teste">Folha de QR de teste</a></p></div>';
  return h;
}

    if (ac === 'delegar') {

function abrirQR(o){

/* ── 4 · SONDA ?sonda=1 — a mesma tabela da sonda de 16/10 (lancadora-sonda-plataforma/), feita para o Tobia conferir no tablet ── */
function telaSonda(){
  return luCab('Sonda da plataforma') + '<p class="lu-mini">Versão sonda-2 · 19/10/2026 · mede se este endereço serve o que o modo sem rede precisa.</p>' +
    '<div class="lu-veredito" id="sonda-veredito">Medindo…</div><table class="lu-t" id="sonda-tabela"></table>' +
    '<p class="lu-mini lu-gap">Depois de tudo verde: desligue o Wi-Fi e os dados e recarregue esta página. Se ela abrir, o modo sem rede funciona aqui.</p>' +
    '<p class="lu-gap"><button class="lu-linkpeq" id="sonda-voltar">‹ voltar</button></p>';
}
function ligarSonda(){
  var sv = luEl('sonda-voltar'); if (sv) sv.onclick = paraALista;
  var tab = luEl('sonda-tabela'), oks = [];
  function linha(o, r, ok){ oks.push(ok); var tr = document.createElement('tr'); tr.innerHTML = '<td>' + esc(o) + '</td><td class="' + (ok ? 'lu-sim' : 'lu-nao') + '">' + (ok ? '✓ ' : '✗ ') + esc(r) + '</td>'; tab.appendChild(tr); }
  function tipo(u){
    var ctl = ('AbortController' in window) ? new AbortController() : null, t = ctl && setTimeout(function(){ ctl.abort(); }, 6000);
    return fetch(u, { cache:'no-store', signal: ctl ? ctl.signal : undefined }).then(function(r){ clearTimeout(t); return { s:r.status, t:r.headers.get('content-type') || '(sem tipo)' }; })
      .catch(function(e){ clearTimeout(t); return { s:0, t:String(e && e.message || e) }; });
  }
  var h = location.href.split('#')[0];
  linha('Endereço aberto', h, location.protocol === 'https:' ? (!location.port && /\/$/.test(location.pathname)) : /^(localhost|127\.0\.0\.1)$/.test(location.hostname));
  tipo('sw.js').then(function(a){ linha('sw.js (código do modo sem rede)', a.s + ' · ' + a.t, a.s === 200 && /javascript/.test(a.t)); return tipo('manifest.webmanifest'); })
  .then(function(b){ linha('manifest.webmanifest (ícone na tela de início)', b.s + ' · ' + b.t, b.s === 200 && /(manifest|json)/.test(b.t)); return tipo('organizacoes.json'); })
  .then(function(c){ linha('organizacoes.json (a lista de organizações)', c.s + ' · ' + c.t + ' · lida de: ' + (LISTA_ORIGEM || '—'), c.s === 200 && /json/.test(c.t) && LISTA_ORIGEM === 'arquivo'); return tipo('vendor/qrcode.js'); })
  .then(function(d){ linha('subpasta vendor/qrcode.js (leitor e desenho de QR)', d.s + ' · ' + d.t, d.s === 200 && /javascript/.test(d.t)); return tipo('u-mandu-180.png'); })
  .then(function(e){ linha('ícone u-mandu-180.png (solto na raiz)', e.s + ' · ' + e.t, e.s === 200 && /image\/png/.test(e.t)); return tipo('vendor/zxing_reader.wasm'); })
  .then(function(f){ linha('vendor/zxing_reader.wasm (leitor de QR do iPhone)', f.s + ' · ' + f.t, f.s === 200); 
    if (!('serviceWorker' in navigator)) { linha('Registrar o modo sem rede', 'navegador sem suporte', false); return; }
    return navigator.serviceWorker.register('sw.js').then(function(reg){
      return Promise.race([navigator.serviceWorker.ready, new Promise(function(_, rj){ setTimeout(function(){ rj(new Error('não ficou pronto em 8 s')); }, 8000); })]).then(function(){
        linha('Registrar o modo sem rede', 'ok · escopo ' + reg.scope, true);
        return caches.keys();
      }).then(function(ks){
        var meu = ks.filter(function(k){ return k.indexOf('mandu-unica-') === 0; });
        return meu.length ? caches.open(meu[0]).then(function(c){ return c.keys(); }).then(function(rs){ linha('Arquivos guardados no aparelho', meu[0] + ' · ' + rs.length + ' arquivo(s)', rs.length >= 8); }) : linha('Arquivos guardados no aparelho', 'nenhum cache mandu-unica-* ainda', false);
      });
    }).catch(function(er){ linha('Registrar o modo sem rede', String(er && er.message || er), false); });
  }).then(function(){
    var bom = oks.every(Boolean), v = luEl('sonda-veredito'); if (!v) return;
    v.textContent = bom ? 'VERDE: este endereço serve tudo que o modo sem rede precisa.' : 'VERMELHO: tire um print desta tela e mande para a orquestração.';
    v.style.borderLeftColor = bom ? '#1E7A46' : '#B3261E'; v.setAttribute('data-veredito', bom ? 'verde' : 'vermelho');
  });
}

/* ── rota de entrada: o endereço decide a tela ─────────────────────────────────────────────────────── */
function rotaInicial(){
  var q = location.search;
  if (paramDaUrl(q, 'sonda')) { TELA = { nome:'sonda' }; return; }
  if (paramDaUrl(q, 'painel') === 'administrador' || paramDaUrl(q, 'admin') === '1') { entrarAdmin(); aplicarNomes(); TELA = { nome:'painel' }; return; }
  var org = paramDaUrl(q, 'org');
  if (org && !paramDaUrl(q, 'lote')) { TELA = { nome:'sub', org:org }; return; }
  if (!paramDaUrl(q, 'lote') && !paramDaUrl(q, 'lista') && !ler().modoOffline) {
    /* H10-284 · nas próximas visitas abre direto na organização escolhida (guardada neste aparelho); `?lista=1` mostra a lista de novo.
       A organização histórica e a que ainda não tem app nunca abrem sozinhas. */
    if (ehAdmin()) { aplicarNomes(); TELA = { nome:'painel' }; return; }   /* H10-341 · aparelho do administrador abre o Painel, nunca uma organização sozinho */
    var u = achaOrg(ultima);
    if (u && !u.pendente && !u.historico && disponiveis().indexOf(u) >= 0) { TELA = { nome:'sub', org:u.id }; return; }
  }
  TELA = { nome:'inicio', form:null };
}
function classeDaTela(nome){
  if (nome === 'painel') return 'cartao lu-largo';
  if (nome === 'sonda') return 'cartao lu-medio';
  if (nome === 'sub' || nome === 'abrindo') return 'cartao lu-estreito';
  if (nome === 'inicio') { var db = ler(); return (db.modoOffline && orgAtual()) ? 'cartao' : 'cartao lu-estreito'; }
  return 'cartao';
}
