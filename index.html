<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão de Estoque · Mandū</title>
<link rel="icon" href="icones/u-mandu-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/u-mandu-180.png">
<meta name="theme-color" content="#FF6E00">
<style>
  :root{--orange:#FF6E00;--orange-dark:#B24D00;--navy:#0E2A47;--bg:#F7F8FA;--text:#1A1A1A;--text2:#5A6472}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:Ubuntu,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:24px}
  .cartao{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:32px 24px 28px;
          box-shadow:0 2px 24px rgba(14,42,71,.10);text-align:center}
  img.marca{width:64px;height:auto;display:block;margin:0 auto 14px}
  h1{margin:0 0 4px;font-size:22px;line-height:1.25}
  .sub{margin:0 0 24px;color:var(--text2);font-size:14px}
  a.botao{display:block;background:var(--orange);color:#fff;text-decoration:none;font-weight:700;
          font-size:17px;padding:16px;border-radius:12px;margin-bottom:10px}
  a.botao:active{background:var(--orange-dark)}
  .nota{margin:18px 0 0;font-size:12px;color:var(--text2);line-height:1.5}
</style>
</head>
<body>
  <main class="cartao">
    <img class="marca" src="icones/u-mandu-180.png" width="62" height="84" alt="Mandū">
    <h1>Gestão de Estoque</h1>
    <p class="sub">Camtauá · Mandū Inovação Social</p>
    <a class="botao" href="https://script.google.com/macros/s/AKfycbyw9syhEIyuaMaYT-ej95koauzv4hXlLJEyAXY6OMwL4Ba6socaChpIapRx9ekWcVve/exec">Abrir o aplicativo ›</a>
    <p class="nota">Adicione esta página à tela de início para ficar com o ícone do Ū.
       O aplicativo abre em seguida, na conta Google do galpão.</p>
  </main>
</body>
</html>
