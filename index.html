<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gestão de Estoque · Mandū</title>
<link rel="icon" href="icones/u-mandu-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icones/u-mandu-180.png">
<meta name="theme-color" content="#FF6E00">
<style>
  :root{--orange:#FF6E00;--orange-dark:#B24D00;--navy:#0E2A47;--bg:#F7F8FA;--text:#1A1A1A;--text2:#5A6472;--line:#E3E6EB}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:Ubuntu,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
       display:flex;min-height:100dvh;align-items:center;justify-content:center;padding:24px 16px}
  .cartao{width:100%;max-width:420px;background:#fff;border-radius:18px;padding:32px 24px 28px;
          box-shadow:0 2px 24px rgba(14,42,71,.10);text-align:center}
  img.marca{width:64px;height:auto;display:block;margin:0 auto 14px}
  h1{margin:0 0 4px;font-size:22px;line-height:1.25}
  .sub{margin:0 0 22px;color:var(--text2);font-size:14px}
  .lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);text-align:left;margin:0 0 8px}
  .orgs{display:flex;flex-direction:column;gap:10px;margin:0 0 6px}
  a.org{display:flex;align-items:center;gap:12px;text-align:left;text-decoration:none;color:var(--text);
        border:1.5px solid var(--line);border-radius:12px;padding:14px}
  a.org:hover,a.org:focus-visible{border-color:var(--orange);outline:none}
  a.org .n{font-weight:700;font-size:16px;display:block}
  a.org .d{font-size:13px;color:var(--text2);display:block}
  a.org .seta{margin-left:auto;color:var(--orange);font-weight:700;font-size:20px}
  a.org.ultima{border-color:var(--orange);background:#FFF5EE}
  a.org .tag{font-size:11px;font-weight:700;color:var(--orange-dark);margin-left:6px}
  .nota{margin:18px 0 0;font-size:12px;color:var(--text2);line-height:1.5}
</style>
</head>
<body>
  <main class="cartao">
    <img class="marca" src="icones/u-mandu-180.png" width="62" height="84" alt="Mandū">
    <h1>Gestão de Estoque</h1>
    <p class="sub">Mandū Inovação Social</p>
    <p class="lbl">Escolha a organização</p>
    <nav class="orgs" id="orgs" aria-label="Organizações"></nav>
    <p class="nota">Entre com a conta Google da organização (@mandusocial.org).
       Adicione esta página à tela de início para ficar com o ícone do Ū.</p>
  </main>
<script>
/* Link LONGO sempre (/a/macros/<domínio>/): com duas contas Google no mesmo
   navegador, o link curto abre na conta padrão — se for um Gmail pessoal, o
   Google responde «unable to open the file». O longo força a conta do domínio.
   Organização nova = uma linha aqui (até existir a sala de comando multi-org).
   Fonte desta página: camtaua/copias/lancadora/index.html no repositório sistema. */
var ORGS = [
  { id:'camtaua', nome:'Camtauá', desc:'Santo Antônio do Tauá, PA',
    url:'https://script.google.com/a/macros/mandusocial.org/s/AKfycbyw9syhEIyuaMaYT-ej95koauzv4hXlLJEyAXY6OMwL4Ba6socaChpIapRx9ekWcVve/exec' },
  { id:'demo', nome:'Camtauá · Demonstração', desc:'Base limpa para teste e apresentação',
    url:'https://script.google.com/a/macros/mandusocial.org/s/AKfycbyVou5SnmL8RYNWqWWDIb0sY-WsiTW7zvCTnCd9mDnXg7vNj_onBWOKphDJlGR0TC2J/exec' }
];
var ultima = null;
try { ultima = localStorage.getItem('estoque_org'); } catch(e) {}
var nav = document.getElementById('orgs');
ORGS.forEach(function(o){
  var a = document.createElement('a');
  a.className = 'org' + (o.id === ultima ? ' ultima' : '');
  a.href = o.url;
  a.innerHTML = '<span><span class="n"></span><span class="d"></span></span><span class="seta">›</span>';
  a.querySelector('.n').textContent = o.nome;
  if (o.id === ultima) { var t = document.createElement('span'); t.className = 'tag'; t.textContent = 'última usada'; a.querySelector('.n').appendChild(t); }
  a.querySelector('.d').textContent = o.desc;
  a.addEventListener('click', function(){ try { localStorage.setItem('estoque_org', o.id); } catch(e) {} });
  nav.appendChild(a);
});
</script>
</body>
</html>
